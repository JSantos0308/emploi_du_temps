<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Emploi du Temps</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .auth-box, .app-box {
      display: none;
    }
    .active {
      display: block;
    }
    input, button, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .btn-logout {
      background-color: #dc3545;
      width: auto;
      float: right;
    }
    .btn-logout:hover {
      background-color: #bd2130;
    }
    .switch-mode {
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      color: #007bff;
      text-decoration: underline;
    }
    textarea {
      height: 200px;
      resize: vertical;
    }
    .header {
      overflow: hidden;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ZONE DE CONNEXION / INSCRIPTION -->
  <div id="auth-section" class="auth-box active">
    <h2 id="auth-title">Connexion</h2>
    <input type="email" id="email" placeholder="Adresse e-mail">
    <input type="password" id="password" placeholder="Mot de passe">
    <button id="btn-auth" onclick="handleAuth()">Se connecter</button>
    <p id="auth-error" style="color: red; text-align: center;"></p>
    <div class="switch-mode" onclick="toggleAuthMode()" id="switch-text">
      Pas encore de compte ? S'inscrire
    </div>
  </div>

  <!-- ZONE APPLICATION (EMPLOI DU TEMPS) -->
  <div id="app-section" class="app-box">
    <div class="header">
      <button class="btn-logout" onclick="logout()">Se déconnecter</button>
      <h2 id="welcome-msg">Mon Emploi du Temps</h2>
    </div>
    
    <label for="schedule-data"><b>Vos cours et notes sauvegardés :</b></label>
    <textarea id="schedule-data" placeholder="Écrivez vos cours, horaires ou notes ici..."></textarea>
    <button onclick="saveData()">💾 Enregistrer les modifications</button>
    <p id="save-status" style="color: green; font-weight: bold;"></p>
  </div>

</div>

<!-- SCRIPTS FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    setDoc, 
    getDoc 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Vos identifiants Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyADndGQPP7OjP0pK1wqfeZrdZQ84_iLrys",
    authDomain: "emploi-du-temps-2ffd6.firebaseapp.com",
    projectId: "emploi-du-temps-2ffd6",
    storageBucket: "emploi-du-temps-2ffd6.firebasestorage.app",
    messagingSenderId: "897752698709",
    appId: "1:897752698709:web:a1ac2f8be097f3ad6a69dc",
    measurementId: "G-NX917W181S"
  };

  // Initialisation
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isSignUpMode = false;
  let currentUser = null;

  // Basculer entre Connexion et Inscription
  window.toggleAuthMode = function() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('auth-title').innerText = isSignUpMode ? "Créer un compte" : "Connexion";
    document.getElementById('btn-auth').innerText = isSignUpMode ? "S'inscrire" : "Se connecter";
    document.getElementById('switch-text').innerText = isSignUpMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    document.getElementById('auth-error').innerText = "";
  };

  // Action Connexion / Inscription
  window.handleAuth = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('auth-error');
    errorEl.innerText = "";

    try {
      if (isSignUpMode) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (error) {
      errorEl.innerText = "Erreur : " + error.message;
    }
  };

  // Déconnexion
  window.logout = function() {
    signOut(auth);
  };

  // Écouteur d'état de connexion (s'exécute quand l'utilisateur se connecte/déconnecte)
  onAuthStateChanged(auth, async (user) => {
    const authSec = document.getElementById('auth-section');
    const appSec = document.getElementById('app-section');

    if (user) {
      currentUser = user;
      authSec.classList.remove('active');
      appSec.classList.add('active');
      document.getElementById('welcome-msg').innerText = "Emploi du temps (" + user.email + ")";
      
      // Charger les données de cet utilisateur précis
      loadData(user.uid);
    } else {
      currentUser = null;
      appSec.classList.remove('active');
      authSec.classList.add('active');
    }
  });

  // Sauvegarder les données dans Firestore
  window.saveData = async function() {
    if (!currentUser) return;
    const data = document.getElementById('schedule-data').value;
    const statusEl = document.getElementById('save-status');

    try {
      await setDoc(doc(db, "users", currentUser.uid), {
        content: data,
        updatedAt: new Date()
      });
      statusEl.innerText = "Modifications enregistrées avec succès !";
      setTimeout(() => statusEl.innerText = "", 3000);
    } catch (e) {
      alert("Erreur de sauvegarde : " + e.message);
    }
  };

  // Charger les données depuis Firestore
  async function loadData(uid) {
    const docRef = doc(db, "users", uid);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {
      document.getElementById('schedule-data').value = docSnap.data().content || "";
    } else {
      document.getElementById('schedule-data').value = "";
    }
  }
</script>

</body>
</html>
