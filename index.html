<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Mon Emploi du Temps XL</title>
  <style>
    :root {
      --bg-theorie: #8bb0e8;
      --bg-labo: #c5fa79;
      --bg-exercices: #98d380;
      --bg-etude: #ff9999;
      --border-color: #cccccc;
      --row-height: calc((100vh - 72px) / 12);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      overflow: hidden;
    }

    /* AUTHENTIFICATION */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .auth-card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .auth-card h2 { margin: 0 0 8px 0; color: #333; text-align: center; font-size: 16px; }
    .auth-card input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .auth-card button { padding: 8px; border: none; border-radius: 4px; font-weight: bold; background: #007bff; color: white; cursor: pointer; font-size: 12px; }
    .switch-mode { text-align: center; color: #007bff; cursor: pointer; font-size: 11px; text-decoration: underline; }

    /* BARRE DE CONTROLE DU HAUT */
    .controls-box {
      background: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 2px 8px;
      height: 32px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .controls-box select {
      padding: 2px 4px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 3px;
      border: 1px solid #ccc;
      background: white;
      color: #333;
      height: 24px;
    }

    .btn-action {
      padding: 2px 6px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 24px;
      white-space: nowrap;
    }

    .btn-draw { background: #6f42c1; }
    .btn-copy { background: #007bff; }
    .btn-clear { background: #dc3545; }
    .btn-export { background: #20c997; }
    .btn-import { background: #17a2b8; }
    .btn-save-cloud { background: #28a745; }
    .btn-logout { background: #6c757d; }
    .btn-config { background: #343a40; }
    .btn-history { background: #495057; }
    .btn-active { outline: 2px solid #333; box-shadow: 0 0 4px rgba(0,0,0,0.5); }

    /* BARRE D'OUTILS DE DESSIN FLOTTANTE (STYLE TÉLÉPHONE) */
    .drawing-toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.9);
      padding: 8px 14px;
      border-radius: 30px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
    }

    .drawing-toolbar.active {
      display: flex;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .tool-btn.selected {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 0 2px #007bff;
    }

    .tool-color-picker {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    /* CONTENEUR ET GRILLE */
    .timetable-container {
      width: 100vw;
      height: calc(100vh - 32px);
      overflow-y: auto;
      background-color: white;
      position: relative;
    }

    #drawingCanvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
      pointer-events: none;
    }

    #drawingCanvas.active {
      pointer-events: auto;
      z-index: 25;
      cursor: crosshair;
    }

    .week-block {
      margin-bottom: 20px;
    }

    .week-divider {
      height: 45px;
      background-color: #ffffff;
      border: none;
    }

    .header-row {
      display: grid;
      grid-template-columns: 55px repeat(7, 1fr);
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: #ffffff;
      color: #111111;
      height: 22px;
      border-bottom: 2px solid #cccccc;
      border-top: 1px solid #e0e0e0;
    }

    .header-cell {
      border-right: 1px solid #e0e0e0;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .timetable-body {
      display: grid;
      grid-template-columns: 55px repeat(7, 1fr);
      grid-template-rows: repeat(12, var(--row-height));
    }

    .time-cell, .slot {
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    .time-cell {
      background-color: #f8f9fa;
      font-size: 10px;
      padding: 2px 4px;
      color: #333;
      font-weight: bold;
      display: flex;
      align-items: flex-start;
    }

    .slot { position: relative; cursor: pointer; touch-action: none; z-index: 2; }
    .slot.drag-over { background-color: #e2e8f0; border: 2px dashed #007bff; }
    .slot:hover { background-color: #f9f9f9; }

    /* CARTES DE COURS */
    .course-card {
      position: absolute;
      top: 1px; left: 1px; right: 1px;
      border-radius: 2px;
      padding: 2px 4px;
      color: #111;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.15);
      z-index: 6;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .course-card:active { cursor: grabbing; opacity: 0.7; }
    .course-card.theorie { background-color: var(--bg-theorie); }
    .course-card.exercices { background-color: var(--bg-exercices); }
    .course-card.labo { background-color: var(--bg-labo); }
    .course-card.etude { background-color: var(--bg-etude); }

    .course-card .header-title { font-weight: bold; font-size: 9.5px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .course-card .subtitle { font-size: 8.5px; line-height: 1.1; color: #222222; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .course-card .location { font-size: 8px; font-weight: bold; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* MODALE COURS */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 15px;
      border-radius: 6px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 11px;
    }

    .modal-content input, .modal-content select, .modal-content textarea {
      padding: 5px;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 3px;
      width: 100%;
    }

    .btn-group { display: flex; gap: 4px; flex-wrap: wrap; justify-content: space-between; margin-top: 6px; }
    .btn-save { background: #28a745; color: white; }
    .btn-delete { background: #dc3545; color: white; }
    .btn-cancel { background: #6c757d; color: white; }
    .btn-modal-copy { background: #17a2b8; color: white; }
    .btn-modal-paste { background: #fd7e14; color: white; }
  </style>
</head>
<body>

  <!-- AUTHENTIFICATION FIREBASE -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h2 id="authTitle">Connexion</h2>
      <input type="email" id="email" placeholder="Adresse e-mail">
      <input type="password" id="password" placeholder="Mot de passe">
      <button id="btnAuth" onclick="handleAuth()">Se connecter</button>
      <p id="authError" style="color: red; font-size: 11px; text-align: center; margin: 0;"></p>
      <div class="switch-mode" id="switchText" onclick="toggleAuthMode()">Pas encore de compte ? S'inscrire</div>
    </div>
  </div>

  <!-- BARRE DE CONTROLE DU HAUT -->
  <div class="controls-box">
    <div class="controls-group">
      <select id="selectWeek" onchange="scrollToSelectedWeek()"></select>
    </div>

    <div class="controls-group">
      <button id="btnPencil" class="btn-action btn-draw" onclick="toggleDrawingMode()">✏️ Dessiner</button>
      <button class="btn-action btn-history" onclick="undoGlobal()" title="Annuler">↩️</button>
      <button class="btn-action btn-history" onclick="redoGlobal()" title="Rétablir">↪️</button>
    </div>

    <div class="controls-group">
      <button class="btn-action btn-config" onclick="openConfigModal('courses')">⚙️ Cours</button>
      <button class="btn-action btn-config" onclick="openConfigModal('locations')">⚙️ Locaux</button>
      <button class="btn-action btn-copy" onclick="copyPreviousWeek()">📋 Copier Préc.</button>
      <button class="btn-action btn-clear" onclick="clearCurrentWeek()">🗑️ Effacer Semaine</button>
      <button class="btn-action btn-export" onclick="exportData()">💾 Exporter</button>
      <button class="btn-action btn-import" onclick="document.getElementById('importFile').click()">📂 Importer</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn-action btn-save-cloud" onclick="saveDataToCloud()">☁️ Sauvegarder</button>
      <button class="btn-action btn-logout" onclick="logout()">🚪</button>
    </div>
  </div>

  <!-- BARRE D'OUTILS DE DESSIN FLOTTANTE (STYLE TÉLÉPHONE) -->
  <div id="drawingToolbar" class="drawing-toolbar">
    <button id="toolPen" class="tool-btn selected" title="Crayon" onclick="setDrawingTool('pen')">✏️</button>
    <button id="toolHighlighter" class="tool-btn" title="Surligneur" onclick="setDrawingTool('highlighter')">🖍️</button>
    <button id="toolEraser" class="tool-btn" title="Gomme" onclick="setDrawingTool('eraser')">🧹</button>
    <input type="color" id="toolColor" class="tool-color-picker" value="#dc3545" title="Couleur du tracé">
    <button class="tool-btn" title="Tout effacer" onclick="clearCanvas()">🗑️</button>
  </div>

  <div class="timetable-container" id="scrollContainer">
    <canvas id="drawingCanvas"></canvas>
    <div id="weeksWrapper"></div>
  </div>

  <!-- MODALE EDITION ACTIVITÉ -->
  <div class="modal" id="courseModal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin:0 0 5px 0;">Détails de l'activité</h3>
      
      <label>Code / Type de cours :</label>
      <input type="text" id="courseSearch" list="coursesDatalist" placeholder="Ex: ELECH3001 - Théorie">
      <datalist id="coursesDatalist"></datalist>

      <label>Nom / Intitulé du cours :</label>
      <input type="text" id="courseSubTitle" placeholder="Ex: Électricité appliquée">

      <label>Durée :</label>
      <select id="courseDuration">
        <option value="1">1 heure</option>
        <option value="2" selected>2 heures</option>
        <option value="3">3 heures</option>
        <option value="4">4 heures</option>
      </select>

      <label>Type / Couleur :</label>
      <select id="courseType">
        <option value="theorie">Théorie (Bleu)</option>
        <option value="exercices">Exercices / TP (Vert Moyen)</option>
        <option value="labo">Laboratoire / Pratique (Vert Clair)</option>
        <option value="etude">Étude / Perso (Rouge)</option>
      </select>

      <label>Local / Lieu :</label>
      <input type="text" id="courseLocation" list="locationsList" placeholder="Ex: Auditoire FERRER...">
      <datalist id="locationsList"></datalist>

      <div class="btn-group">
        <button class="btn-action btn-save" onclick="saveCourse()">Enregistrer</button>
        <button id="btnModalCopy" class="btn-action btn-modal-copy" onclick="copyCurrentCourseModal()">📋 Copier</button>
        <button id="btnModalPaste" class="btn-action btn-modal-paste" onclick="pasteCourseModal()" style="display:none;">📋 Coller</button>
        <button class="btn-action btn-delete" onclick="deleteCourse()">Supprimer</button>
        <button class="btn-action btn-cancel" onclick="closeModal()">Annuler</button>
      </div>
    </div>
  </div>

  <!-- MODALE GESTION GLOBALE (COURS / LOCAUX) -->
  <div class="modal" id="configModal">
    <div class="modal-content" style="width: 360px;">
      <h3 id="configModalTitle" style="margin:0 0 5px 0;">Gestion</h3>
      <p id="configModalDesc" style="margin:0; font-size:10px; color:#555;"></p>
      
      <textarea id="configTextarea" rows="8" placeholder="Entrez un élément par ligne..."></textarea>

      <div class="btn-group">
        <button class="btn-action btn-save" onclick="saveConfigModal()">Mettre à jour</button>
        <button class="btn-action btn-cancel" onclick="closeConfigModal()">Fermer</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE CONFIGURATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADndGQPP7OjP0pK1wqfeZrdZQ84_iLrys",
      authDomain: "emploi-du-temps-2ffd6.firebaseapp.com",
      projectId: "emploi-du-temps-2ffd6",
      storageBucket: "emploi-du-temps-2ffd6.firebasestorage.app",
      messagingSenderId: "897752698709",
      appId: "1:897752698709:web:a1ac2f8be097f3ad6a69dc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let isSignUpMode = false;

    window.toggleAuthMode = function() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('authTitle').innerText = isSignUpMode ? "Créer un compte" : "Connexion";
      document.getElementById('btnAuth').innerText = isSignUpMode ? "S'inscrire" : "Se connecter";
      document.getElementById('switchText').innerText = isSignUpMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
      document.getElementById('authError').innerText = "";
    };

    window.handleAuth = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const err = document.getElementById('authError');
      err.innerText = "";

      try {
        if (isSignUpMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (e) {
        err.innerText = "Erreur : " + e.message;
      }
    };

    window.logout = function() {
      signOut(auth);
    };

    onAuthStateChanged(auth, async (user) => {
      const overlay = document.getElementById('authOverlay');
      if (user) {
        currentUser = user;
        overlay.style.display = 'none';
        await loadDataFromCloud();
      } else {
        currentUser = null;
        overlay.style.display = 'flex';
      }
    });

    window.saveDataToCloud = async function() {
      if (!currentUser) return;
      const allData = getAllWeeksData();
      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          timetable: allData,
          drawings: weekDrawings,
          locations: getStoredLocations(),
          courses: getStoredCourses(),
          updatedAt: new Date()
        });
        alert("Emploi du temps, cours et locaux sauvegardés sur le Cloud !");
      } catch (e) {
        alert("Erreur lors de la sauvegarde : " + e.message);
      }
    };

    async function loadDataFromCloud() {
      if (!currentUser) return;
      try {
        const docRef = doc(db, "users", currentUser.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.timetable) {
            localStorage.setItem('timetable_multi_weeks', JSON.stringify(data.timetable));
            loadAllWeeksData();
          }
          if (data.drawings) {
            weekDrawings = data.drawings;
            saveVectorData();
            redrawVectorCanvas();
          }
          if (data.locations) {
            localStorage.setItem('timetable_saved_locations', JSON.stringify(data.locations));
            updateLocationsDatalist();
          }
          if (data.courses) {
            localStorage.setItem('timetable_saved_courses', JSON.stringify(data.courses));
            updateCoursesDatalist();
          }
          initGlobalHistory();
        }
      } catch (e) {
        console.error("Erreur de chargement Cloud:", e);
      }
    }
  </script>

  <!-- LOGIQUE EMPLOI DU TEMPS -->
  <script>
    const startDateS1 = new Date(2026, 8, 14); // 14 septembre 2026
    const hours = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];
    let currentVisibleWeek = "S1";
    let selectedSlot = null;
    let draggedCardData = null;
    let copiedCourseBuffer = null;
    let hoveredSlot = null;
    let currentConfigType = null;

    let weekDrawings = {}; 
    let currentPath = null;
    let isDrawingActive = false;
    let currentTool = 'pen';

    // HISTORIQUE GLOBAL UNIFIÉ (COURS + DESSINS + LOCAUX)
    let globalHistory = [];
    let globalHistoryIndex = -1;

    function captureGlobalState() {
      return {
        timetable: getAllWeeksData(),
        drawings: JSON.parse(JSON.stringify(weekDrawings)),
        locations: getStoredLocations(),
        courses: getStoredCourses()
      };
    }

    function pushGlobalHistory() {
      const state = captureGlobalState();
      if (globalHistoryIndex < globalHistory.length - 1) {
        globalHistory = globalHistory.slice(0, globalHistoryIndex + 1);
      }
      globalHistory.push(JSON.stringify(state));
      globalHistoryIndex = globalHistory.length - 1;
    }

    function initGlobalHistory() {
      globalHistory = [JSON.stringify(captureGlobalState())];
      globalHistoryIndex = 0;
    }

    function applyGlobalState(stateObj) {
      localStorage.setItem('timetable_multi_weeks', JSON.stringify(stateObj.timetable || {}));
      weekDrawings = stateObj.drawings || {};
      localStorage.setItem('timetable_drawings_vector', JSON.stringify(weekDrawings));
      localStorage.setItem('timetable_saved_locations', JSON.stringify(stateObj.locations || []));
      localStorage.setItem('timetable_saved_courses', JSON.stringify(stateObj.courses || []));

      loadAllWeeksDataSilent();
      redrawVectorCanvas();
      updateLocationsDatalist();
      updateCoursesDatalist();
      resizeCanvas();
    }

    function undoGlobal() {
      if (globalHistoryIndex > 0) {
        globalHistoryIndex--;
        const stateObj = JSON.parse(globalHistory[globalHistoryIndex]);
        applyGlobalState(stateObj);
      }
    }

    function redoGlobal() {
      if (globalHistoryIndex < globalHistory.length - 1) {
        globalHistoryIndex++;
        const stateObj = JSON.parse(globalHistory[globalHistoryIndex]);
        applyGlobalState(stateObj);
      }
    }

    function getStoredCourses() {
      const saved = localStorage.getItem('timetable_saved_courses');
      if (saved) return JSON.parse(saved);
      return [
        "ELECH3001 - Théorie",
        "ELECH3001 - Exercices 1",
        "ELECH3001 - Exercices 2",
        "MATHH2000 - Théorie",
        "MATHH2000 - Exercices",
        "MATHH3001 - Théorie",
        "MATHH3001 - Exercices 2",
        "MECAH200 - Exercices 2"
      ];
    }

    function updateCoursesDatalist() {
      const list = document.getElementById('coursesDatalist');
      list.innerHTML = '';
      getStoredCourses().forEach(c => {
        let opt = document.createElement('option');
        opt.value = c;
        list.appendChild(opt);
      });
    }

    function getStoredLocations() {
      const saved = localStorage.getItem('timetable_saved_locations');
      if (saved) return JSON.parse(saved);
      return ["Bibliothèque", "Maison", "Casa", "Auditoire FERRER", "Auditoire GUILLISSEN", "Auditoire Aretha FRANKLIN"];
    }

    function saveLocation(loc) {
      if (!loc || loc.trim() === '') return;
      let locations = getStoredLocations();
      loc = loc.trim();
      if (!locations.includes(loc)) {
        locations.push(loc);
        localStorage.setItem('timetable_saved_locations', JSON.stringify(locations));
        updateLocationsDatalist();
      }
    }

    function updateLocationsDatalist() {
      const locationsList = document.getElementById('locationsList');
      locationsList.innerHTML = '';
      getStoredLocations().forEach(loc => {
        let opt = document.createElement('option');
        opt.value = loc;
        locationsList.appendChild(opt);
      });
    }

    function openConfigModal(type) {
      currentConfigType = type;
      const titleEl = document.getElementById('configModalTitle');
      const descEl = document.getElementById('configModalDesc');
      const textarea = document.getElementById('configTextarea');

      if (type === 'courses') {
        titleEl.textContent = "Liste globale des Cours";
        descEl.textContent = "Modifiez ou ajoutez vos cours (un par ligne) :";
        textarea.value = getStoredCourses().join('\n');
      } else {
        titleEl.textContent = "Liste globale des Locaux";
        descEl.textContent = "Modifiez ou ajoutez vos locaux (un par ligne) :";
        textarea.value = getStoredLocations().join('\n');
      }
      document.getElementById('configModal').style.display = 'flex';
    }

    function closeConfigModal() {
      document.getElementById('configModal').style.display = 'none';
    }

    function saveConfigModal() {
      const text = document.getElementById('configTextarea').value;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');

      if (currentConfigType === 'courses') {
        localStorage.setItem('timetable_saved_courses', JSON.stringify(lines));
        updateCoursesDatalist();
        alert("Liste des cours mise à jour !");
      } else if (currentConfigType === 'locations') {
        localStorage.setItem('timetable_saved_locations', JSON.stringify(lines));
        updateLocationsDatalist();
        alert("Liste des locaux mise à jour !");
      }
      pushGlobalHistory();
      closeConfigModal();
    }

    const weekSelect = document.getElementById('selectWeek');
    const weeksWrapper = document.getElementById('weeksWrapper');

    function formatDateShort(date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      return `${d}/${m}`;
    }

    function getMondayOfWeek(weekNum) {
      const monday = new Date(startDateS1);
      monday.setDate(startDateS1.getDate() + (weekNum - 1) * 7);
      return monday;
    }

    function getCurrentWeekKey() {
      const today = new Date();
      const diffTime = today - startDateS1;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      let weekNum = Math.floor(diffDays / 7) + 1;
      if (weekNum < 1) weekNum = 1;
      if (weekNum > 14) weekNum = 14;
      return `S${weekNum}`;
    }

    for (let w = 1; w <= 14; w++) {
      const weekKey = `S${w}`;
      const mon = getMondayOfWeek(w);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);

      let opt = document.createElement('option');
      opt.value = weekKey;
      opt.textContent = `Semaine ${w} (${formatDateShort(mon)} - ${formatDateShort(sun)})`;
      weekSelect.appendChild(opt);

      const weekBlock = document.createElement('div');
      weekBlock.id = `week-block-${weekKey}`;
      weekBlock.className = 'week-block';

      if (w > 1) {
        const divider = document.createElement('div');
        divider.className = 'week-divider';
        weekBlock.appendChild(divider);
      }

      const headerRow = document.createElement('div');
      headerRow.className = 'header-row';

      const daysNames = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

      const cornerCell = document.createElement('div');
      cornerCell.className = 'header-cell';
      cornerCell.textContent = weekKey;
      headerRow.appendChild(cornerCell);

      for (let d = 0; d < 7; d++) {
        const currentDayDate = new Date(mon);
        currentDayDate.setDate(mon.getDate() + d);

        const dayCell = document.createElement('div');
        dayCell.className = 'header-cell';

        const dd = String(currentDayDate.getDate()).padStart(2, '0');
        const mm = String(currentDayDate.getMonth() + 1).padStart(2, '0');
        const yy = String(currentDayDate.getFullYear()).slice(-2);

        dayCell.textContent = `${daysNames[d]} ${dd}/${mm}/${yy}`;
        headerRow.appendChild(dayCell);
      }

      weekBlock.appendChild(headerRow);

      const grid = document.createElement('div');
      grid.className = 'timetable-body';

      hours.forEach((h, hIndex) => {
        const timeCell = document.createElement('div');
        timeCell.className = 'time-cell';
        timeCell.textContent = h;
        grid.appendChild(timeCell);

        for (let day = 0; day < 7; day++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.dataset.week = weekKey;
          slot.dataset.day = day;
          slot.dataset.hour = hIndex;

          slot.onmouseenter = () => { hoveredSlot = slot; };
          slot.onmouseleave = () => { if (hoveredSlot === slot) hoveredSlot = null; };

          slot.onclick = (e) => { 
            if(!isDrawingActive && !e.target.classList.contains('course-card')) {
              openModal(slot); 
            }
          };

          slot.ondragover = (e) => {
            e.preventDefault();
            slot.classList.add('drag-over');
          };

          slot.ondragleave = () => {
            slot.classList.remove('drag-over');
          };

          slot.ondrop = (e) => {
            e.preventDefault();
            slot.classList.remove('drag-over');
            if (draggedCardData) {
              if (checkOverlap(slot, draggedCardData.duration, draggedCardData.sourceSlot)) {
                draggedCardData = null;
                return;
              }
              if (draggedCardData.sourceSlot) {
                draggedCardData.sourceSlot.textContent = '';
              }
              slot.textContent = '';
              addCardToSlot(
                slot, 
                draggedCardData.title, 
                draggedCardData.subtitle,
                draggedCardData.type, 
                draggedCardData.loc, 
                draggedCardData.duration
              );
              saveAllWeeksData();
              pushGlobalHistory();
              resizeCanvas();
              draggedCardData = null;
            }
          };

          grid.appendChild(slot);
        }
      });

      weekBlock.appendChild(grid);
      weeksWrapper.appendChild(weekBlock);
    }

    function checkOverlap(targetSlot, duration, sourceSlot = null) {
      const wKey = targetSlot.dataset.week;
      const day = targetSlot.dataset.day;
      const startHour = parseInt(targetSlot.dataset.hour);

      for (let h = startHour; h < startHour + duration; h++) {
        if (h >= hours.length) return true;
        const checkSlot = document.querySelector(`.slot[data-week="${wKey}"][data-day="${day}"][data-hour="${h}"]`);
        if (checkSlot && checkSlot !== sourceSlot && checkSlot.querySelector('.course-card')) {
          return true;
        }
      }
      return false;
    }

    window.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT' || activeEl.tagName === 'TEXTAREA')) {
        return; 
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
        if (hoveredSlot) {
          const card = hoveredSlot.querySelector('.course-card');
          if (card) {
            copiedCourseBuffer = {
              title: card.dataset.title,
              subtitle: card.dataset.subtitle || '',
              type: card.dataset.type,
              loc: card.dataset.loc,
              duration: parseInt(card.dataset.duration)
            };
          }
        }
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
        if (hoveredSlot && copiedCourseBuffer) {
          if (checkOverlap(hoveredSlot, copiedCourseBuffer.duration)) return;
          hoveredSlot.textContent = '';
          addCardToSlot(
            hoveredSlot,
            copiedCourseBuffer.title,
            copiedCourseBuffer.subtitle,
            copiedCourseBuffer.type,
            copiedCourseBuffer.loc,
            copiedCourseBuffer.duration
          );
          saveAllWeeksData();
          pushGlobalHistory();
          resizeCanvas();
        }
      }
    });

    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('scrollContainer');

    let isDrawing = false;
    let startX = 0, startY = 0;

    function resizeCanvas() {
      canvas.width = container.scrollWidth;
      canvas.height = container.scrollHeight;
      redrawVectorCanvas();
    }

    window.addEventListener('resize', resizeCanvas);

    function toggleDrawingMode() {
      isDrawingActive = !isDrawingActive;
      const btnPencil = document.getElementById('btnPencil');
      const toolbar = document.getElementById('drawingToolbar');

      if (isDrawingActive) {
        resizeCanvas();
        btnPencil.classList.add('btn-active');
        toolbar.classList.add('active');
        canvas.classList.add('active');
      } else {
        btnPencil.classList.remove('btn-active');
        toolbar.classList.remove('active');
        canvas.classList.remove('active');
      }
    }

    function setDrawingTool(tool) {
      currentTool = tool;
      document.getElementById('toolPen').classList.toggle('selected', tool === 'pen');
      document.getElementById('toolHighlighter').classList.toggle('selected', tool === 'highlighter');
      document.getElementById('toolEraser').classList.toggle('selected', tool === 'eraser');
    }

    function getCanvasCoords(e) {
      const rect = container.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      return {
        x: clientX - rect.left + container.scrollLeft,
        y: clientY - rect.top + container.scrollTop
      };
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchend', stopDrawing);

    function startDrawing(e) {
      if (!isDrawingActive) return;
      e.preventDefault();
      isDrawing = true;
      const coords = getCanvasCoords(e);
      startX = coords.x;
      startY = coords.y;

      if (!weekDrawings[currentVisibleWeek]) {
        weekDrawings[currentVisibleWeek] = [];
      }

      const color = document.getElementById('toolColor').value;

      if (currentTool === 'pen') {
        currentPath = { type: 'pen', color: color, points: [{x: startX, y: startY}] };
      } else if (currentTool === 'highlighter') {
        currentPath = { type: 'highlighter', color: color, points: [{x: startX, y: startY}] };
      } else if (currentTool === 'eraser') {
        eraseVectorAt(coords.x, coords.y);
      }
    }

    function draw(e) {
      if (!isDrawing || !isDrawingActive) return;
      e.preventDefault();
      const coords = getCanvasCoords(e);

      if (currentTool === 'pen' || currentTool === 'highlighter') {
        currentPath.points.push({x: coords.x, y: coords.y});
        redrawVectorCanvas();
        drawSingleItem(currentPath);
      } else if (currentTool === 'eraser') {
        eraseVectorAt(coords.x, coords.y);
      }
    }

    function eraseVectorAt(x, y) {
      const items = weekDrawings[currentVisibleWeek] || [];
      const radius = 15;
      weekDrawings[currentVisibleWeek] = items.filter(item => {
        return !item.points.some(p => Math.hypot(p.x - x, p.y - y) < radius);
      });
      redrawVectorCanvas();
      saveVectorData();
      pushGlobalHistory();
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        if (currentPath && currentTool !== 'eraser') {
          if (!weekDrawings[currentVisibleWeek]) weekDrawings[currentVisibleWeek] = [];
          weekDrawings[currentVisibleWeek].push(currentPath);
        }
        currentPath = null;
        saveVectorData();
        pushGlobalHistory();
      }
    }

    function redrawVectorCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const items = weekDrawings[currentVisibleWeek] || [];
      items.forEach(drawSingleItem);
    }

    function drawSingleItem(item) {
      if (!item.points || item.points.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(item.points[0].x, item.points[0].y);
      for (let i = 1; i < item.points.length; i++) {
        ctx.lineTo(item.points[i].x, item.points[i].y);
      }

      if (item.type === 'pen') {
        ctx.strokeStyle = item.color || '#dc3545';
        ctx.lineWidth = 2.5;
        ctx.globalAlpha = 1.0;
      } else if (item.type === 'highlighter') {
        ctx.strokeStyle = item.color || '#ffeb3b';
        ctx.lineWidth = 14;
        ctx.globalAlpha = 0.4;
      }
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }

    function clearCanvas() {
      if (confirm('Effacer les annotations de cette semaine ?')) {
        weekDrawings[currentVisibleWeek] = [];
        redrawVectorCanvas();
        saveVectorData();
        pushGlobalHistory();
      }
    }

    function saveVectorData() {
      localStorage.setItem('timetable_drawings_vector', JSON.stringify(weekDrawings));
    }

    function loadVectorData() {
      const saved = localStorage.getItem('timetable_drawings_vector');
      weekDrawings = saved ? JSON.parse(saved) : {};
      redrawVectorCanvas();
    }

    window.onload = () => {
      loadAllWeeksData();
      loadVectorData();
      updateLocationsDatalist();
      updateCoursesDatalist();
      initGlobalHistory();

      // Ciblage explicite sur la semaine actuelle (Semaine 2 en date du 25 septembre 2026)
      const targetWeek = getCurrentWeekKey();
      currentVisibleWeek = targetWeek;
      weekSelect.value = targetWeek;

      setTimeout(() => {
        scrollToSelectedWeek();
        resizeCanvas();
      }, 100);

      container.addEventListener('scroll', () => {
        for (let w = 1; w <= 14; w++) {
          const block = document.getElementById(`week-block-S${w}`);
          if (block) {
            const rect = block.getBoundingClientRect();
            if (rect.top <= 100 && rect.bottom >= 100) {
              if (currentVisibleWeek !== `S${w}`) {
                currentVisibleWeek = `S${w}`;
                weekSelect.value = currentVisibleWeek;
                redrawVectorCanvas();
              }
              break;
            }
          }
        }
      });
    };

    function scrollToSelectedWeek() {
      const selected = weekSelect.value;
      const targetBlock = document.getElementById(`week-block-${selected}`);
      if (targetBlock) {
        targetBlock.scrollIntoView({ behavior: 'auto' }); // Défilement immédiat à l'ouverture
      }
    }

    function getAllWeeksData() {
      const saved = localStorage.getItem('timetable_multi_weeks');
      return saved ? JSON.parse(saved) : {};
    }

    function saveAllWeeksData() {
      const allData = {};
      document.querySelectorAll('.slot').forEach(slot => {
        const card = slot.querySelector('.course-card');
        if (card) {
          const wKey = slot.dataset.week;
          if (!allData[wKey]) allData[wKey] = [];
          allData[wKey].push({
            day: slot.dataset.day,
            hour: slot.dataset.hour,
            duration: card.dataset.duration || 2,
            title: card.dataset.title,
            subtitle: card.dataset.subtitle || '',
            type: card.dataset.type,
            loc: card.dataset.loc
          });
        }
      });
      localStorage.setItem('timetable_multi_weeks', JSON.stringify(allData));
    }

    function loadAllWeeksData() {
      document.querySelectorAll('.slot').forEach(s => s.textContent = '');
      const allData = getAllWeeksData();
      Object.keys(allData).forEach(wKey => {
        (allData[wKey] || []).forEach(item => {
          const slot = document.querySelector(`.slot[data-week="${wKey}"][data-day="${item.day}"][data-hour="${item.hour}"]`);
          if (slot) addCardToSlot(slot, item.title, item.subtitle, item.type, item.loc, parseInt(item.duration));
        });
      });
    }

    function loadAllWeeksDataSilent() {
      document.querySelectorAll('.slot').forEach(s => s.textContent = '');
      const allData = getAllWeeksData();
      Object.keys(allData).forEach(wKey => {
        (allData[wKey] || []).forEach(item => {
          const slot = document.querySelector(`.slot[data-week="${wKey}"][data-day="${item.day}"][data-hour="${item.hour}"]`);
          if (slot) addCardToSlot(slot, item.title, item.subtitle, item.type, item.loc, parseInt(item.duration));
        });
      });
    }

    function openModal(slot) {
      selectedSlot = slot;
      const parentCard = slot.querySelector('.course-card');
      
      const btnCopy = document.getElementById('btnModalCopy');
      const btnPaste = document.getElementById('btnModalPaste');

      if (parentCard) {
        document.getElementById('courseSearch').value = parentCard.dataset.title || '';
        document.getElementById('courseSubTitle').value = parentCard.dataset.subtitle || '';
        document.getElementById('courseType').value = parentCard.dataset.type || 'theorie';
        document.getElementById('courseLocation').value = parentCard.dataset.loc || '';
        document.getElementById('courseDuration').value = parentCard.dataset.duration || '2';
        btnCopy.style.display = 'inline-block';
        btnPaste.style.display = 'none';
      } else {
        document.getElementById('courseSearch').value = '';
        document.getElementById('courseSubTitle').value = '';
        document.getElementById('courseType').value = 'theorie';
        document.getElementById('courseLocation').value = '';
        document.getElementById('courseDuration').value = '2';
        btnCopy.style.display = 'none';
        btnPaste.style.display = copiedCourseBuffer ? 'inline-block' : 'none';
      }
      updateLocationsDatalist();
      updateCoursesDatalist();
      document.getElementById('courseModal').style.display = 'flex';
    }

    function copyCurrentCourseModal() {
      if (!selectedSlot) return;
      const parentCard = selectedSlot.querySelector('.course-card');
      if (parentCard) {
        copiedCourseBuffer = {
          title: parentCard.dataset.title,
          subtitle: parentCard.dataset.subtitle || '',
          type: parentCard.dataset.type,
          loc: parentCard.dataset.loc,
          duration: parseInt(parentCard.dataset.duration)
        };
      }
      closeModal();
    }

    function pasteCourseModal() {
      if (!selectedSlot || !copiedCourseBuffer) return;
      if (checkOverlap(selectedSlot, copiedCourseBuffer.duration)) return;
      selectedSlot.textContent = '';
      addCardToSlot(
        selectedSlot,
        copiedCourseBuffer.title,
        copiedCourseBuffer.subtitle,
        copiedCourseBuffer.type,
        copiedCourseBuffer.loc,
        copiedCourseBuffer.duration
      );
      saveAllWeeksData();
      pushGlobalHistory();
      closeModal();
      resizeCanvas();
    }

    function closeModal() { document.getElementById('courseModal').style.display = 'none'; }

    function saveCourse() {
      if (!selectedSlot) return;
      const title = document.getElementById('courseSearch').value;
      const subtitle = document.getElementById('courseSubTitle').value;
      const type = document.getElementById('courseType').value;
      const loc = document.getElementById('courseLocation').value;
      const duration = parseInt(document.getElementById('courseDuration').value);

      if (title.trim() !== '' && checkOverlap(selectedSlot, duration, selectedSlot)) return;

      saveLocation(loc);
      selectedSlot.textContent = '';
      if (title.trim() !== '') addCardToSlot(selectedSlot, title, subtitle, type, loc, duration);
      saveAllWeeksData();
      pushGlobalHistory();
      closeModal();
      resizeCanvas();
    }

    function deleteCourse() {
      if (selectedSlot) selectedSlot.textContent = '';
      saveAllWeeksData();
      pushGlobalHistory();
      closeModal();
      resizeCanvas();
    }

    function addCardToSlot(slot, title, subtitle, type, loc, duration = 2) {
      const card = document.createElement('div');
      card.className = `course-card ${type}`;
      card.dataset.title = title;
      card.dataset.subtitle = subtitle || '';
      card.dataset.type = type;
      card.dataset.loc = loc;
      card.dataset.duration = duration;
      
      card.style.height = `calc(var(--row-height) * ${duration} - 2px)`;
      card.draggable = true;

      const topGroup = document.createElement('div');

      const divHeader = document.createElement('div');
      divHeader.className = 'header-title';
      divHeader.textContent = title;
      topGroup.appendChild(divHeader);

      if (subtitle) {
        const divSub = document.createElement('div');
        divSub.className = 'subtitle';
        divSub.textContent = subtitle;
        topGroup.appendChild(divSub);
      }

      card.appendChild(topGroup);

      if (loc) {
        const divLoc = document.createElement('div');
        divLoc.className = 'location';
        divLoc.textContent = loc;
        card.appendChild(divLoc);
      }

      card.onclick = (e) => {
        e.stopPropagation();
        if (!isDrawingActive) {
          openModal(slot);
        }
      };

      card.ondragstart = (e) => {
        draggedCardData = {
          title: card.dataset.title,
          subtitle: card.dataset.subtitle,
          type: card.dataset.type,
          loc: card.dataset.loc,
          duration: parseInt(card.dataset.duration),
          sourceSlot: slot
        };
        e.dataTransfer.effectAllowed = 'move';
      };

      card.ontouchstart = () => {
        if (isDrawingActive) return;
        draggedCardData = {
          title: card.dataset.title,
          subtitle: card.dataset.subtitle,
          type: card.dataset.type,
          loc: card.dataset.loc,
          duration: parseInt(card.dataset.duration),
          sourceSlot: slot
        };
      };

      card.ontouchend = (e) => {
        if (!draggedCardData || isDrawingActive) return;
        const touch = e.changedTouches[0];
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetSlot = targetEl ? targetEl.closest('.slot') : null;

        if (targetSlot) {
          if (!checkOverlap(targetSlot, draggedCardData.duration, draggedCardData.sourceSlot)) {
            if (draggedCardData.sourceSlot) draggedCardData.sourceSlot.textContent = '';
            targetSlot.textContent = '';
            addCardToSlot(
              targetSlot, 
              draggedCardData.title, 
              draggedCardData.subtitle,
              draggedCardData.type, 
              draggedCardData.loc, 
              draggedCardData.duration
            );
            saveAllWeeksData();
            pushGlobalHistory();
            resizeCanvas();
          }
        }
        draggedCardData = null;
      };

      slot.appendChild(card);
    }

    function copyPreviousWeek() {
      const currentWeekNum = parseInt(currentVisibleWeek.replace('S', ''));
      if (currentWeekNum <= 1) return alert("Pas de semaine précédente avant la S1 !");
      const prevWeekKey = `S${currentWeekNum - 1}`;
      const allData = getAllWeeksData();
      if (confirm(`Copier la ${prevWeekKey} dans la ${currentVisibleWeek} ?`)) {
        allData[currentVisibleWeek] = JSON.parse(JSON.stringify(allData[prevWeekKey] || []));
        localStorage.setItem('timetable_multi_weeks', JSON.stringify(allData));
        loadAllWeeksData();
        pushGlobalHistory();
        resizeCanvas();
      }
    }

    function clearCurrentWeek() {
      if (confirm(`Effacer l'emploi du temps de la semaine ${currentVisibleWeek} ?`)) {
        document.querySelectorAll(`.slot[data-week="${currentVisibleWeek}"]`).forEach(s => s.textContent = '');
        saveAllWeeksData();
        pushGlobalHistory();
        resizeCanvas();
      }
    }

    function exportData() {
      const payload = {
        weeks: getAllWeeksData(),
        drawings: weekDrawings,
        locations: getStoredLocations(),
        courses: getStoredCourses()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `emploi_du_temps_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.weeks) localStorage.setItem('timetable_multi_weeks', JSON.stringify(data.weeks));
          if (data.drawings) localStorage.setItem('timetable_drawings_vector', JSON.stringify(data.drawings));
          if (data.locations) localStorage.setItem('timetable_saved_locations', JSON.stringify(data.locations));
          if (data.courses) localStorage.setItem('timetable_saved_courses', JSON.stringify(data.courses));
          loadAllWeeksData();
          loadVectorData();
          updateLocationsDatalist();
          updateCoursesDatalist();
          initGlobalHistory();
          alert("Données importées avec succès !");
        } catch (err) {
          alert("Fichier JSON invalide.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
