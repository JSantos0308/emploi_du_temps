<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Emploi du Temps</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .auth-box, .app-box {
      display: none;
    }
    .active {
      display: block;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
      width: 100%;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-save {
      background-color: #28a745;
      color: white;
      font-size: 16px;
      margin-top: 20px;
      width: 100%;
    }
    .btn-save:hover {
      background-color: #218838;
    }
    .btn-logout {
      background-color: #dc3545;
      color: white;
      float: right;
    }
    .btn-logout:hover {
      background-color: #bd2130;
    }
    .switch-mode {
      text-align: center;
      margin-top: 15px;
      cursor: pointer;
      color: #007bff;
      text-decoration: underline;
    }
    .header {
      overflow: hidden;
      margin-bottom: 20px;
      border-bottom: 2px solid #eef0f3;
      padding-bottom: 15px;
    }
    .header h2 {
      margin: 0;
      font-size: 22px;
      color: #2c3e50;
    }
    
    /* Table d'emploi du temps */
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px;
      text-align: center;
      min-width: 140px;
    }
    th {
      background-color: #007bff;
      color: white;
      font-weight: 600;
    }
    th.time-col {
      background-color: #343a40;
      width: 100px;
      min-width: 100px;
    }
    td.time-cell {
      background-color: #f8f9fa;
      font-weight: bold;
      color: #495057;
    }
    td textarea {
      width: 100%;
      height: 60px;
      border: none;
      resize: none;
      font-family: inherit;
      font-size: 13px;
      background: transparent;
      outline: none;
      text-align: center;
    }
    td textarea:focus {
      background-color: #e8f0fe;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ZONE DE CONNEXION / INSCRIPTION -->
  <div id="auth-section" class="auth-box active">
    <h2 id="auth-title">Connexion</h2>
    <input type="email" id="email" placeholder="Adresse e-mail">
    <input type="password" id="password" placeholder="Mot de passe">
    <button id="btn-auth" class="btn-primary" onclick="handleAuth()">Se connecter</button>
    <p id="auth-error" style="color: red; text-align: center;"></p>
    <div class="switch-mode" onclick="toggleAuthMode()" id="switch-text">
      Pas encore de compte ? S'inscrire
    </div>
  </div>

  <!-- ZONE APPLICATION (EMPLOI DU TEMPS) -->
  <div id="app-section" class="app-box">
    <div class="header">
      <button class="btn-logout" onclick="logout()">Se déconnecter</button>
      <h2 id="welcome-msg">Mon Emploi du Temps</h2>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th class="time-col">Horaire</th>
            <th>Lundi</th>
            <th>Mardi</th>
            <th>Mercredi</th>
            <th>Jeudi</th>
            <th>Vendredi</th>
          </tr>
        </thead>
        <tbody id="schedule-body">
          <!-- Généré dynamiquement en JavaScript -->
        </tbody>
      </table>
    </div>

    <button class="btn-save" onclick="saveData()">💾 Enregistrer mon emploi du temps</button>
    <p id="save-status" style="color: green; font-weight: bold; text-align: center; margin-top: 10px;"></p>
  </div>

</div>

<!-- SCRIPTS FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    setDoc, 
    getDoc 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADndGQPP7OjP0pK1wqfeZrdZQ84_iLrys",
    authDomain: "emploi-du-temps-2ffd6.firebaseapp.com",
    projectId: "emploi-du-temps-2ffd6",
    storageBucket: "emploi-du-temps-2ffd6.firebasestorage.app",
    messagingSenderId: "897752698709",
    appId: "1:897752698709:web:a1ac2f8be097f3ad6a69dc",
    measurementId: "G-NX917W181S"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isSignUpMode = false;
  let currentUser = null;

  const hours = [
    "08:00 - 10:00",
    "10:00 - 12:00",
    "12:00 - 14:00",
    "14:00 - 16:00",
    "16:00 - 18:00"
  ];

  const days = ["lundi", "mardi", "mercredi", "jeudi", "vendredi"];

  // Génération du tableau d'emploi du temps
  function generateTable() {
    const tbody = document.getElementById('schedule-body');
    tbody.innerHTML = '';

    hours.forEach((hour, hIndex) => {
      const tr = document.createElement('tr');
      
      // Colonne Heure
      const tdTime = document.createElement('td');
      tdTime.className = 'time-cell';
      tdTime.innerText = hour;
      tr.appendChild(tdTime);

      // Colonnes Jours
      days.forEach(day => {
        const td = document.createElement('td');
        const textarea = document.createElement('textarea');
        textarea.id = `${day}-${hIndex}`;
        textarea.placeholder = "Ajouter un cours...";
        td.appendChild(textarea);
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
  }

  generateTable();

  window.toggleAuthMode = function() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('auth-title').innerText = isSignUpMode ? "Créer un compte" : "Connexion";
    document.getElementById('btn-auth').innerText = isSignUpMode ? "S'inscrire" : "Se connecter";
    document.getElementById('switch-text').innerText = isSignUpMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    document.getElementById('auth-error').innerText = "";
  };

  window.handleAuth = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('auth-error');
    errorEl.innerText = "";

    try {
      if (isSignUpMode) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (error) {
      errorEl.innerText = "Erreur : " + error.message;
    }
  };

  window.logout = function() {
    signOut(auth);
  };

  onAuthStateChanged(auth, async (user) => {
    const authSec = document.getElementById('auth-section');
    const appSec = document.getElementById('app-section');

    if (user) {
      currentUser = user;
      authSec.classList.remove('active');
      appSec.classList.add('active');
      document.getElementById('welcome-msg').innerText = "Emploi du temps (" + user.email + ")";
      loadData(user.uid);
    } else {
      currentUser = null;
      appSec.classList.remove('active');
      authSec.classList.add('active');
    }
  });

  window.saveData = async function() {
    if (!currentUser) return;
    const statusEl = document.getElementById('save-status');

    const scheduleData = {};
    days.forEach(day => {
      hours.forEach((_, hIndex) => {
        const cellValue = document.getElementById(`${day}-${hIndex}`).value;
        scheduleData[`${day}-${hIndex}`] = cellValue;
      });
    });

    try {
      await setDoc(doc(db, "users", currentUser.uid), {
        schedule: scheduleData,
        updatedAt: new Date()
      });
      statusEl.innerText = "Emploi du temps enregistré avec succès !";
      setTimeout(() => statusEl.innerText = "", 3000);
    } catch (e) {
      alert("Erreur de sauvegarde : " + e.message);
    }
  };

  async function loadData(uid) {
    const docRef = doc(db, "users", uid);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists() && docSnap.data().schedule) {
      const schedule = docSnap.data().schedule;
      days.forEach(day => {
        hours.forEach((_, hIndex) => {
          const key = `${day}-${hIndex}`;
          const el = document.getElementById(key);
          if (el && schedule[key] !== undefined) {
            el.value = schedule[key];
          }
        });
      });
    }
  }
</script>

</body>
</html>
