<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon Emploi du Temps XL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --bg-theorie:#8bb0e8; --bg-labo:#c5fa79; --bg-exercices:#98d380; --bg-etude:#ff9999;
  --border-color:#cccccc; --row-height:56px;
  --today-bg:#e6f4ea; --today-header-bg:#0f5132; --today-header-color:#ffffff;
}
* { box-sizing:border-box; }
html,body{
  width:100%; height:100%; margin:0; padding:0;
  font-family:Arial,sans-serif; background:#fff; overflow:hidden;
}
body{ display:flex; flex-direction:column; }

.auth-overlay{
  position:fixed; inset:0; background:#f4f6f9; display:flex; justify-content:center; align-items:center; z-index:3000;
}
.auth-card{ background:#fff; padding:24px; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.15); width:320px; max-width:92vw; display:flex; flex-direction:column; gap:10px; }
.auth-card h2{ margin:0 0 4px; color:#333; text-align:center; font-size:16px; }
.auth-card input{ padding:8px; border:1px solid #ccc; border-radius:4px; font-size:13px; }
.auth-card button{ padding:8px; border:none; border-radius:4px; font-weight:bold; background:#007bff; color:#fff; cursor:pointer; font-size:13px; }
.link-btn{ background:none!important; border:none; color:#007bff!important; cursor:pointer; font-size:11px; text-decoration:underline; padding:0!important; text-align:center; }
.auth-msg{ font-size:11px; text-align:center; margin:0; min-height:1.4em; }
.auth-msg.error{ color:#b02a37; }
.auth-msg.ok{ color:#1a7431; }
.auth-skip{ text-align:center; margin-top:4px; }

.controls-box{
  background:#fff; border-bottom:1px solid #e0e0e0; padding:4px 8px; min-height:36px; width:100%;
  display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; flex:0 0 auto; z-index:20;
}
.controls-group{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

.nav-bar-custom {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  font-weight: bold;
  color: #333;
}
.btn-today {
  background: none;
  border: none;
  color: #007bff;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  padding: 2px 4px;
}
.btn-today:hover { text-decoration: underline; }

.week-switcher {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #f8f9fa;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 2px 6px;
}
.btn-week-nav {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  color: #007bff;
  padding: 0 4px;
}
.btn-week-nav:hover { color: #0056b3; }
.current-week-label { font-size: 12px; text-transform: lowercase; }

.date-range-container {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
}
.week-dates-btn {
  background: #f8f9fa;
  border: 1px solid #ccc;
  border-radius: 4px;
  color: #0f5132;
  font-weight: bold;
  font-size: 11px;
  padding: 3px 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.week-dates-btn:hover { background: #e9ecef; }
.date-picker-hidden {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 0;
  height: 0;
}

.btn-action{
  padding:2px 7px; font-size:11px; font-weight:bold; border-radius:3px; border:none; cursor:pointer; color:#fff;
  display:inline-flex; align-items:center; gap:3px; height:24px; white-space:nowrap;
}
.btn-draw{ background:#6f42c1; } .btn-copy{ background:#007bff; } .btn-clear{ background:#dc3545; }
.btn-logout{ background:#6c757d; } .btn-config{ background:#343a40; } .btn-history{ background:#495057; }
.btn-filter{ background:#e8590c; } .btn-share{ background:#0ca678; }
.btn-active{ outline:2px solid #333; box-shadow:0 0 4px rgba(0,0,0,.5); }
.btn-action:disabled{ opacity:.4; cursor:not-allowed; }
.save-status{ font-size:10.5px; color:#666; white-space:nowrap; display:flex; align-items:center; gap:4px; }
.save-dot{ width:7px; height:7px; border-radius:50%; background:#adb5bd; flex:none; }
.save-dot.saving{ background:#f0ad4e; }
.save-dot.saved{ background:#28a745; }
.save-dot.error{ background:#dc3545; }
.save-dot.offline{ background:#6c757d; }

.viewonly-badge{ background:#e8590c; color:#fff; border-radius:3px; padding:2px 8px; font-size:11px; }

/* PANNEAU FILTRE */
.filter-panel{
  position:fixed; top:54px; right:10px; background:#fff; border:1px solid #ccc; border-radius:6px;
  box-shadow:0 4px 16px rgba(0,0,0,.2); padding:12px; width:280px; z-index:120; display:none; font-size:12px;
}
.filter-panel.open{ display:block; }
.filter-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:bold; font-size:14px; }
.filter-clear { font-size:11px; color:#007bff; cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; }
.filter-group{ margin-bottom:10px; display:flex; flex-direction:column; gap:4px; }
.filter-group label { font-size:11px; color:#333; font-weight:bold; }
.filter-panel select{ width:100%; padding:5px; font-size:11px; border:1px solid #ccc; border-radius:3px; background:#fff; }
.btn-filter-submit{ background:#0f5132; color:#fff; width:100%; padding:6px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; margin-top:6px; }

.drawing-toolbar{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(30,30,30,.9);
  padding:8px 14px; border-radius:30px; display:none; align-items:center; gap:10px; z-index:100;
  box-shadow:0 4px 15px rgba(0,0,0,.3); backdrop-filter:blur(5px);
}
.drawing-toolbar.active{ display:flex; }
.tool-btn{ background:transparent; border:none; color:#fff; font-size:16px; cursor:pointer; padding:6px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background .2s; }
.tool-btn:hover{ background:rgba(255,255,255,.2); }
.tool-btn.selected{ background:rgba(255,255,255,.35); box-shadow:0 0 0 2px #007bff; }
.tool-color-picker{ width:24px; height:24px; border:none; border-radius:50%; cursor:pointer; background:transparent; }

.timetable-container{ width:100%; flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; background:#fff; position:relative; }
#drawingCanvas{ position:absolute; top:0; left:0; z-index:5; pointer-events:none; }
#drawingCanvas.active{ pointer-events:auto; z-index:25; cursor:crosshair; touch-action:none; }
.now-line{ position:absolute; height:2px; background:#e8590c; z-index:8; pointer-events:none; border-radius:1px; }
.now-line::before{ content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:#e8590c; }

.week-block{ margin-bottom:20px; }
.week-divider{ height:20px; }

.header-row{
  display:grid; grid-template-columns:55px repeat(7,1fr); position:sticky; top:0; z-index:10;
  background:#fff; color:#111; height:22px; border-bottom:2px solid #ccc; border-top:1px solid #e0e0e0;
}
.header-cell{ border-right:1px solid #e0e0e0; font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:11px; padding:0 2px; overflow:hidden; }
.header-cell.today-col { background: var(--today-header-bg); color: var(--today-header-color); }

.timetable-body{ display:grid; grid-template-columns:55px repeat(7,1fr); grid-template-rows:repeat(12,var(--row-height)); }
.time-cell,.slot{ border-bottom:1px solid var(--border-color); border-right:1px solid var(--border-color); }
.time-cell{ background:#f8f9fa; font-size:10px; padding:2px 4px; color:#333; font-weight:bold; display:flex; align-items:flex-start; }
.slot{ position:relative; cursor:pointer; z-index:2; }
.slot.today-col { background: var(--today-bg); }
.slot.drag-over{ background:#e2e8f0; border:2px dashed #007bff; }
.slot:hover{ background:#f9f9f9; }
.slot.view-only{ cursor:default; }

.course-card{
  position:absolute; top:1px; left:1px; right:1px; border-radius:2px; padding:2px 4px; color:#111; overflow:hidden;
  border:1px solid rgba(0,0,0,.15); z-index:6; display:flex; flex-direction:column; justify-content:space-between;
  cursor:grab; user-select:none; transition:opacity .15s;
}
.course-card:active{ cursor:grabbing; opacity:.7; }
.course-card.dimmed{ opacity:.12; }
.course-card.theorie{ background:var(--bg-theorie); } .course-card.exercices{ background:var(--bg-exercices); }
.course-card.labo{ background:var(--bg-labo); } .course-card.etude{ background:var(--bg-etude); }
.course-card .header-title{ font-weight:bold; font-size:9.5px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.course-card .subtitle{ font-size:8.5px; line-height:1.1; color:#222; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.course-card .location{ font-size:8px; font-weight:bold; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); justify-content:center; align-items:center; z-index:1000; }
.modal-content{ background:#fff; padding:15px; border-radius:6px; width:320px; max-width:92vw; max-height:92vh; overflow:auto; display:flex; flex-direction:column; gap:8px; font-size:11px; }
.modal-content label{ display:block; margin:2px 0; }
.modal-content input,.modal-content select,.modal-content textarea{ padding:5px; font-size:11px; border:1px solid #ccc; border-radius:3px; width:100%; }
.modal-error{ color:#b02a37; font-weight:bold; min-height:1.2em; font-size:11px; }
.modal-hint{ color:#666; font-size:10px; margin:0; }
.btn-group{ display:flex; gap:4px; flex-wrap:wrap; justify-content:space-between; margin-top:6px; }
.btn-save{ background:#28a745; color:#fff; } .btn-delete{ background:#dc3545; color:#fff; } .btn-cancel{ background:#6c757d; color:#fff; }
.btn-modal-copy{ background:#17a2b8; color:#fff; } .btn-modal-paste{ background:#fd7e14; color:#fff; }

.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#212529; color:#fff; padding:10px 18px; border-radius:6px; font-size:13px; max-width:92vw; z-index:2500; opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <h2 id="authTitle">Connexion</h2>
    <input type="email" id="email" placeholder="Adresse e-mail" autocomplete="email">
    <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="btnAuth" type="button">Se connecter</button>
    <button id="btnForgot" type="button" class="link-btn">Mot de passe oublié ?</button>
    <p id="authMsg" class="auth-msg"></p>
    <div class="link-btn" id="switchText" style="text-align:center;">Pas encore de compte ? S'inscrire</div>
    <div class="auth-skip"><button id="btnSkip" type="button" class="link-btn">Continuer hors ligne (sans compte)</button></div>
  </div>
</div>

<div class="controls-box">
  <div class="controls-group">
    <div class="nav-bar-custom">
      <button id="btnTodayNav" class="btn-today">Aujourd'hui</button>
      <div class="week-switcher">
        <button id="btnPrevWeek" class="btn-week-nav" title="Semaine précédente">&lt;</button>
        <span id="currentWeekText" class="current-week-label">s1</span>
        <button id="btnNextWeek" class="btn-week-nav" title="Semaine suivante">&gt;</button>
      </div>
      <div class="date-range-container">
        <button id="btnStartDate" class="week-dates-btn" title="Choisir la date de début"><span id="startDateText">14/09/2026</span></button>
        <input type="date" id="startDatePicker" class="date-picker-hidden">
        <span>-</span>
        <button id="btnEndDate" class="week-dates-btn" title="Choisir la date de fin"><span id="endDateText">20/12/2026</span></button>
        <input type="date" id="endDatePicker" class="date-picker-hidden">
      </div>
    </div>
    <span id="viewOnlyBadge" class="viewonly-badge" style="display:none;">👁️ Lecture seule</span>
  </div>
  <div class="controls-group" id="editGroup1">
    <button id="btnPencil" class="btn-action btn-draw">✏️ Dessiner</button>
    <button id="btnUndo" class="btn-action btn-history" title="Annuler (Ctrl+Z)">↩️</button>
    <button id="btnRedo" class="btn-action btn-history" title="Rétablir (Ctrl+Y)">↪️</button>
    <button id="btnFilter" class="btn-action btn-filter">🔍 Filtre</button>
  </div>
  <div class="controls-group" id="editGroup2">
    <button id="btnConfigCourses" class="btn-action btn-config">⚙️ Cours</button>
    <button id="btnConfigLocations" class="btn-action btn-config">⚙️ Locaux</button>
    <button id="btnCopyPrev" class="btn-action btn-copy">📋 Copier Préc.</button>
    <button id="btnClearWeek" class="btn-action btn-clear">🗑️ Effacer Semaine</button>
    <button id="btnShare" class="btn-action btn-share">🔗 Partager</button>
    <span id="saveStatus" class="save-status"><span class="save-dot" id="saveDot"></span><span id="saveText">Hors ligne</span></span>
    <button id="btnLogout" class="btn-action btn-logout">🚪</button>
  </div>
</div>

<!-- PANNEAU FILTRE -->
<div id="filterPanel" class="filter-panel">
  <div class="filter-header">
    <span>Filtre</span>
    <button id="btnFilterClear" class="filter-clear">Effacer filtre</button>
  </div>
  <div class="filter-group">
    <label>Cours</label>
    <select id="filterSelectCourse">
      <option value="">Tous les cours</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Type de réservation</label>
    <select id="filterSelectType">
      <option value="">Tous les types</option>
      <option value="theorie">Théorie</option>
      <option value="exercices">Exercices / TP</option>
      <option value="labo">Laboratoire</option>
      <option value="etude">Étude / Perso</option>
    </select>
  </div>
  <button id="btnFilterApply" class="btn-filter-submit">Filtre</button>
</div>

<div id="drawingToolbar" class="drawing-toolbar">
  <button id="toolPen" class="tool-btn selected" title="Crayon">✏️</button>
  <button id="toolHighlighter" class="tool-btn" title="Surligneur">🖍️</button>
  <button id="toolEraser" class="tool-btn" title="Gomme">🧹</button>
  <input type="color" id="toolColor" class="tool-color-picker" value="#dc3545" title="Couleur du tracé">
  <button id="btnClearCanvas" class="tool-btn" title="Effacer cette semaine">🗑️</button>
</div>

<div class="timetable-container" id="scrollContainer">
  <canvas id="drawingCanvas"></canvas>
  <div id="weeksWrapper"></div>
</div>

<div class="modal" id="courseModal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <h3 style="margin:0 0 4px;">Détails de l'activité</h3>
    <div>
      <label for="courseSearch">Code / Nom du cours :</label>
      <input type="text" id="courseSearch" list="coursesDatalist" placeholder="Ex: ELECH3001 - Théorie" autocomplete="off">
      <datalist id="coursesDatalist"></datalist>
    </div>
    <div>
      <label for="courseSubTitle">Intitulé complet :</label>
      <input type="text" id="courseSubTitle" placeholder="Ex: Électricité appliquée" autocomplete="off">
    </div>
    <div>
      <label for="courseDuration">Durée :</label>
      <select id="courseDuration">
        <option value="1">1 heure</option><option value="2" selected>2 heures</option>
        <option value="3">3 heures</option><option value="4">4 heures</option>
      </select>
    </div>
    <div>
      <label for="courseType">Type / Couleur :</label>
      <select id="courseType">
        <option value="theorie">Théorie (Bleu)</option>
        <option value="exercices">Exercices / TP (Vert Moyen)</option>
        <option value="labo">Laboratoire / Pratique (Vert Clair)</option>
        <option value="etude">Étude / Perso (Rouge)</option>
      </select>
    </div>
    <div>
      <label for="courseLocation">Local / Lieu :</label>
      <input type="text" id="courseLocation" list="locationsList" placeholder="Ex: Auditoire FERRER..." autocomplete="off">
      <datalist id="locationsList"></datalist>
    </div>
    <div id="modalError" class="modal-error" role="alert"></div>
    <div class="btn-group">
      <button id="btnSaveCourse" class="btn-action btn-save">Enregistrer</button>
      <button id="btnModalCopy" class="btn-action btn-modal-copy">📋 Copier</button>
      <button id="btnModalPaste" class="btn-action btn-modal-paste" style="display:none;">📋 Coller</button>
      <button id="btnDeleteCourse" class="btn-action btn-delete">Supprimer</button>
      <button id="btnCancelCourse" class="btn-action btn-cancel">Annuler</button>
    </div>
  </div>
</div>

<div class="modal" id="configModal" role="dialog" aria-modal="true">
  <div class="modal-content" style="width:380px;">
    <h3 id="configModalTitle" style="margin:0 0 4px;">Gestion</h3>
    <p id="configModalDesc" class="modal-hint"></p>
    <textarea id="configTextarea" rows="10" placeholder="Un élément par ligne..."></textarea>
    <div id="configError" class="modal-error" role="alert"></div>
    <div class="btn-group">
      <button id="btnSaveConfig" class="btn-action btn-save">Mettre à jour</button>
      <button id="btnCloseConfig" class="btn-action btn-cancel">Fermer</button>
    </div>
  </div>
</div>

<div class="modal" id="shareModal" role="dialog" aria-modal="true">
  <div class="modal-content" style="width: 300px;">
    <h3 style="margin:0 0 8px;">Partager / Exporter</h3>
    <p class="modal-hint" style="margin-bottom:8px;">Choisissez une action :</p>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button id="btnShareLink" class="btn-action btn-copy" style="justify-content:center; height:32px;">🔗 Copier le lien</button>
      <button id="btnSharePDF" class="btn-action btn-export" style="justify-content:center; height:32px; background:#20c997; color:#111;">📄 Télécharger en PDF</button>
      <button id="btnShareJSON" class="btn-action btn-import" style="justify-content:center; height:32px; background:#17a2b8;">💾 Télécharger en JSON</button>
      <button id="btnShareClose" class="btn-action btn-cancel" style="justify-content:center; height:32px;">Annuler</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
  onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, deleteDoc, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADndGQPP7OjP0pK1wqfeZrdZQ84_iLrys",
  authDomain: "emploi-du-temps-2ffd6.firebaseapp.com",
  projectId: "emploi-du-temps-2ffd6",
  storageBucket: "emploi-du-temps-2ffd6.firebasestorage.app",
  messagingSenderId: "897752698709",
  appId: "1:897752698709:web:a1ac2f8be097f3ad6a69dc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
try { enableIndexedDbPersistence(db); } catch (e) { }

window.__auth = auth;
window.__fs = { doc, setDoc, getDoc, deleteDoc, db };

let isSignUpMode = false;

function setAuthMsg(text, kind) {
  const el = document.getElementById('authMsg');
  el.textContent = text || '';
  el.className = 'auth-msg' + (kind ? ' ' + kind : '');
}

function translateAuthError(code) {
  const map = {
    'auth/invalid-email': "Adresse e-mail invalide.",
    'auth/user-not-found': "Aucun compte avec cette adresse.",
    'auth/wrong-password': "Mot de passe incorrect.",
    'auth/invalid-credential': "Identifiants incorrects.",
    'auth/email-already-in-use': "Un compte existe déjà avec cette adresse.",
    'auth/weak-password': "Mot de passe trop court (6 caractères minimum).",
    'auth/too-many-requests': "Trop de tentatives, réessayez plus tard.",
    'auth/network-request-failed': "Pas de connexion internet."
  };
  return map[code] || "Une erreur est survenue.";
}

document.getElementById('switchText').addEventListener('click', () => {
  isSignUpMode = !isSignUpMode;
  document.getElementById('authTitle').textContent = isSignUpMode ? "Créer un compte" : "Connexion";
  document.getElementById('btnAuth').textContent = isSignUpMode ? "S'inscrire" : "Se connecter";
  document.getElementById('switchText').textContent = isSignUpMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
  setAuthMsg('');
});

document.getElementById('btnAuth').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  setAuthMsg('');
  if (!email || !password) { setAuthMsg("Indiquez une adresse e-mail et un mot de passe.", 'error'); return; }
  try {
    if (isSignUpMode) {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      sendEmailVerification(cred.user).catch(() => {});
      setAuthMsg("Compte créé. Un e-mail de vérification vous a été envoyé.", 'ok');
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    setAuthMsg(translateAuthError(e.code), 'error');
  }
});

document.getElementById('btnForgot').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) { setAuthMsg("Indiquez votre adresse e-mail ci-dessus, puis cliquez à nouveau.", 'error'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    setAuthMsg("E-mail de réinitialisation envoyé.", 'ok');
  } catch (e) {
    setAuthMsg(translateAuthError(e.code), 'error');
  }
});

<script>
(function () {

      { name:"MATHH3001 - Théorie", type:"theorie", subtitle:"Signaux et systèmes" },
      { name:"MATHH3001 - Exercices", type:"exercices", subtitle:"Signaux et systèmes" },
      { name:"MECAH200 - Théorie", type:"theorie", subtitle:"Mécanique rationnelle II" },
      { name:"MECAH200 - Exercices", type:"exercices", subtitle:"Mécanique rationnelle II" },
      { name:"MECAH200 - Laboratoire", type:"labo", subtitle:"Mécanique rationnelle II" },
      { name:"MECAH3001 - Théorie", type:"theorie", subtitle:"Fluid mechanics and transfer processes" },
      { name:"MECAH3001 - Exercices", type:"exercices", subtitle:"Fluid mechanics and transfer processes" },
      { name:"MECAH3001 - Anglais", type:"labo", subtitle:"Fluid mechanics and transfer processes" },
      { name:"MECAH301 - Théorie", type:"theorie", subtitle:"Systèmes énergétiques" },
      { name:"MECAH301 - Exercices", type:"exercices", subtitle:"Systèmes énergétiques" }
    ],
    defaultLocations: ["Bibliothèque","Maison","Casa","Auditoire FERRER","Auditoire GUILLISSEN","Auditoire Aretha FRANKLIN"]
  };

  const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
  const TYPES = ["theorie","exercices","labo","etude"];
  const H = CONFIG.hours.length;
  const LS = {
    courses:'timetable_courses_v3', catalog:'timetable_catalog_v3', locations:'timetable_locations_v3',
    strokes:'timetable_strokes_v3'
  };

  const $ = (id) => document.getElementById(id);
  const weekKey = (n) => 'S' + n;
  const weekNum = (k) => parseInt(String(k).slice(1), 10);
  let idc = 0; const uid = () => 'c' + (++idc) + '_' + Date.now().toString(36);

  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function readJSON(key, fallback) {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; }
    catch (e) { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { toast("Stockage local plein ou bloqué."); return false; }
  }

  let courses = {};
  let strokes = [];
  let catalog = [];
  let locations = [];
  let filter = { course: '', type: '' };
  let hovered = null;
  let dragged = null;
  let modalCtx = { editing: null };
  let currentVisibleWeek = 'S1';
  let viewOnly = false;
  const slotMap = {}, blocks = {}, headerRows = {};

  function normalizeItem(it) {
    const day = parseInt(it.day, 10), hour = parseInt(it.hour, 10), dur = parseInt(it.duration, 10) || 2;
    if (!(day >= 0 && day < 7 && hour >= 0 && hour < H)) return null;
    const title = String(it.title || '').trim().slice(0, 120);
    if (!title) return null;
    return {
      id: uid(), day, hour, duration: Math.min(Math.max(dur, 1), H - hour),
      title, subtitle: String(it.subtitle || '').slice(0, 120),
      type: TYPES.includes(it.type) ? it.type : 'theorie',
      loc: String(it.loc || '').slice(0, 80)
    };
  }
  function normalizeCourses(raw) {
    const out = {};
    for (let w = 1; w <= CONFIG.weeks; w++) {
      const k = weekKey(w); out[k] = [];
      const arr = raw && Array.isArray(raw[k]) ? raw[k] : [];
      arr.forEach((it) => { const n = it && typeof it === 'object' ? normalizeItem(it) : null; if (n) out[k].push(n); });
    }
    return out;
  }
  function normalizeStrokes(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.filter((s) => {
      if (!s || !/^S\d+$/.test(s.w)) return false;
      const n = weekNum(s.w); if (n < 1 || n > CONFIG.weeks) return false;
      if (s.kind !== 'pen' && s.kind !== 'highlight') return false;
      if (!Array.isArray(s.pts) || s.pts.length < 2) return false;
      return s.pts.every((p) => Array.isArray(p) && p.length === 2 && isFinite(p[0]) && isFinite(p[1]));
    }).map((s) => ({ w: s.w, kind: s.kind, color: /^#[0-9a-fA-F]{3,8}$/.test(s.color) ? s.color : '#dc3545', pts: s.pts }));
  }
  function normalizeCatalog(raw) {
    if (!Array.isArray(raw)) return CONFIG.defaultCatalog.slice();
    const out = raw.filter((c) => c && typeof c.name === 'string' && c.name.trim()).map((c) => ({
      name: c.name.trim().slice(0, 120),
      type: TYPES.includes(c.type) ? c.type : 'theorie',
      subtitle: String(c.subtitle || '').slice(0, 120)
    }));
    return out.length ? out : CONFIG.defaultCatalog.slice();
  }
  function normalizeLocations(raw) {
    if (!Array.isArray(raw)) return CONFIG.defaultLocations.slice();
    const out = raw.filter((x) => typeof x === 'string' && x.trim()).map((x) => x.trim().slice(0, 80)).slice(0, 300);
    return out.length ? out : CONFIG.defaultLocations.slice();
  }

  function serializeAll() {
    const out = {};
    Object.keys(courses).forEach((k) => { out[k] = courses[k].map((c) => ({ day:c.day, hour:c.hour, duration:c.duration, title:c.title, subtitle:c.subtitle, type:c.type, loc:c.loc })); });
    return { courses: out, strokes, catalog, locations };
  }
  function saveLocalAll() {
    const s = serializeAll();
    writeJSON(LS.courses, s.courses);
    writeJSON(LS.strokes, s.strokes);
    writeJSON(LS.catalog, s.catalog);
    writeJSON(LS.locations, s.locations);
  }

  let history = []; let historyIndex = -1; let restoring = false;

  function snapshot() { return JSON.stringify(serializeAll()); }
  function pushHistory() {
    if (restoring) return;
    const s = snapshot();
    if (history[historyIndex] === s) return;
    history = history.slice(0, historyIndex + 1);
    history.push(s);
    if (history.length > 100) history.shift();
    historyIndex = history.length - 1;
    updateHistoryButtons();
  }
  function applySnapshot(s) {
    const data = JSON.parse(s);
    courses = normalizeCourses(data.courses);
    strokes = normalizeStrokes(data.strokes);
    catalog = normalizeCatalog(data.catalog);
    locations = normalizeLocations(data.locations);
    restoring = true;
    renderCards(); updateLocationsDatalist(); updateCoursesDatalist(); refreshFilterOptions(); redraw();
    restoring = false;
    saveLocalAll(); scheduleCloudSave();
  }
  function undo() { if (historyIndex > 0) { historyIndex--; applySnapshot(history[historyIndex]); updateHistoryButtons(); } }
  function redo() { if (historyIndex < history.length - 1) { historyIndex++; applySnapshot(history[historyIndex]); updateHistoryButtons(); } }
  function updateHistoryButtons() {
    $('btnUndo').disabled = historyIndex <= 0;
    $('btnRedo').disabled = historyIndex >= history.length - 1;
  }

  function placementError(week, day, hour, duration, ignoreId) {
    if (hour + duration > H) return "Ce cours dépasse la fin de la grille.";
    const clash = (courses[week] || []).find((c) => c.id !== ignoreId && c.day === day && hour < c.hour + c.duration && c.hour < hour + duration);
    if (clash) return "Ce créneau chevauche « " + clash.title + " » (" + DAYS[day] + ", " + CONFIG.hours[clash.hour] + ").";
    return '';
  }
  function findItem(week, id) { return (courses[week] || []).find((c) => c.id === id) || null; }
  function findItemAt(week, day, hour) { return (courses[week] || []).find((c) => c.day === day && c.hour === hour) || null; }
  function removeItem(week, id) { courses[week] = (courses[week] || []).filter((c) => c.id !== id); }
  function moveItem(fromWeek, id, toWeek, day, hour) {
    const item = findItem(fromWeek, id); if (!item) return;
    if (fromWeek === toWeek && item.day === day && item.hour === hour) return;
    const err = placementError(toWeek, day, hour, item.duration, item.id);
    if (err) { toast(err); return; }
    removeItem(fromWeek, id); item.day = day; item.hour = hour; courses[toWeek].push(item);
    saveLocalAll(); scheduleCloudSave(); pushHistory(); renderCards();
  }

  const weeksWrapper = $('weeksWrapper'), container = $('scrollContainer');
  function fmtShort(d) { return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); }
  function mondayOf(n) { const d = new Date(CONFIG.startDateS1); d.setDate(d.getDate() + (n-1)*7); return d; }
  
  function getCurrentWeekKey() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const start = new Date(CONFIG.startDateS1.getFullYear(), CONFIG.startDateS1.getMonth(), CONFIG.startDateS1.getDate());
    const diffTime = today - start;
    const diffDays = Math.floor(diffTime / 86400000);
    if (diffDays < 0) return 'S1';
    let n = Math.floor(diffDays / 7) + 1; 
    n = Math.min(Math.max(n, 1), CONFIG.weeks);
    return weekKey(n);
  }

  function updateNavBarDisplay(wk) {
    const n = weekNum(wk);
    $('currentWeekText').textContent = 's' + n;
  }

  function updateRangeDisplay(startWk, endWk) {
    const startMon = mondayOf(weekNum(startWk));
    const endMon = mondayOf(weekNum(endWk));
    const endSun = new Date(endMon); endSun.setDate(endSun.getDate() + 6);
    $('startDateText').textContent = fmtShort(startMon) + '/' + startMon.getFullYear();
    $('endDateText').textContent = fmtShort(endSun) + '/' + endSun.getFullYear();
  }

  function buildWeeks() {
    const now = new Date();
    const todayDateOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    for (let w = 1; w <= CONFIG.weeks; w++) {
      const wk = weekKey(w), mon = mondayOf(w), sun = new Date(mon); sun.setDate(sun.getDate()+6);

      const block = document.createElement('div'); block.className = 'week-block'; block.id = 'week-block-' + wk;
      blocks[w] = block;
      if (w > 1) block.appendChild(Object.assign(document.createElement('div'), { className:'week-divider' }));

      const headerRow = document.createElement('div'); headerRow.className = 'header-row';
      headerRows[w] = headerRow;
      const corner = document.createElement('div'); corner.className = 'header-cell'; corner.textContent = wk; headerRow.appendChild(corner);
      
      const dayCells = [];
      for (let d = 0; d < 7; d++) {
        const dayDate = new Date(mon); dayDate.setDate(mon.getDate() + d);
        const cell = document.createElement('div'); cell.className = 'header-cell';
        cell.textContent = DAYS[d] + ' ' + fmtShort(dayDate);
        
        const isToday = (dayDate.getTime() === todayDateOnly.getTime());
        if (isToday) {
          cell.classList.add('today-col');
        }
        headerRow.appendChild(cell);
        dayCells.push(isToday);
      }
      block.appendChild(headerRow);

      const grid = document.createElement('div'); grid.className = 'timetable-body';
      CONFIG.hours.forEach((label, h) => {
        const timeCell = document.createElement('div'); timeCell.className = 'time-cell'; timeCell.textContent = label;
        grid.appendChild(timeCell);
        for (let day = 0; day < 7; day++) {
          const slot = document.createElement('div'); slot.className = 'slot';
          if (dayCells[day]) {
            slot.classList.add('today-col');
          }
          slotMap[wk + '-' + day + '-' + h] = slot;

          slot.addEventListener('mouseenter', () => { hovered = { week: wk, day, hour: h }; });
          slot.addEventListener('mouseleave', () => { if (hovered && hovered.week===wk && hovered.day===day && hovered.hour===h) hovered = null; });
          slot.addEventListener('click', (e) => {
            if (viewOnly || drawMode !== 'none') return;
            if (e.target.closest('.course-card')) return;
            openModal(wk, day, h);
          });
          slot.addEventListener('dragover', (e) => { if (!dragged || viewOnly) return; e.preventDefault(); slot.classList.add('drag-over'); });
          slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
          slot.addEventListener('drop', (e) => {
            e.preventDefault(); slot.classList.remove('drag-over');
            if (!dragged || viewOnly) return;
            const d = dragged; dragged = null; moveItem(d.week, d.id, wk, day, h);
          });
          grid.appendChild(slot);
        }
      });
      block.appendChild(grid);
      weeksWrapper.appendChild(block);
    }
    updateRangeDisplay('S1', weekKey(CONFIG.weeks));
  }

  function cardMatchesFilter(item) {
    if (filter.course && item.title !== filter.course) return false;
    if (filter.type && item.type !== filter.type) return false;
    return true;
  }

  function buildCard(week, item) {
    const card = document.createElement('div');
    card.className = 'course-card ' + item.type + (cardMatchesFilter(item) ? '' : ' dimmed');
    card.style.height = 'calc(var(--row-height) * ' + item.duration + ' - 2px)';
    card.draggable = !viewOnly;

    const title = document.createElement('div'); title.className = 'header-title'; title.textContent = item.title; card.appendChild(title);
    if (item.subtitle) { const s = document.createElement('div'); s.className = 'subtitle'; s.textContent = item.subtitle; card.appendChild(s); }
    if (item.loc) { const l = document.createElement('div'); l.className = 'location'; l.textContent = item.loc; card.appendChild(l); }

    card.addEventListener('click', (e) => { e.stopPropagation(); if (!viewOnly && drawMode === 'none') openModal(week, item.day, item.hour); });
    card.addEventListener('dragstart', (e) => {
      if (viewOnly) { e.preventDefault(); return; }
      dragged = { week, id: item.id }; e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', item.id); } catch (_) {}
    });
    card.addEventListener('dragend', () => { dragged = null; document.querySelectorAll('.slot.drag-over').forEach((s) => s.classList.remove('drag-over')); });

    return card;
  }

  function renderCards() {
    document.querySelectorAll('.course-card').forEach((c) => c.remove());
    Object.keys(courses).forEach((wk) => courses[wk].forEach((item) => {
      const slot = slotMap[wk + '-' + item.day + '-' + item.hour];
      if (slot) slot.appendChild(buildCard(wk, item));
    }));
  }

  function refreshFilterOptions() {
    const selectCourse = $('filterSelectCourse');
    selectCourse.innerHTML = '<option value="">Tous les cours</option>';
    const namesSet = new Set();
    Object.keys(courses).forEach((wk) => courses[wk].forEach((it) => namesSet.add(it.title)));
    Array.from(namesSet).sort().forEach((name) => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      if (filter.course === name) opt.selected = true;
      selectCourse.appendChild(opt);
    });
    $('filterSelectType').value = filter.type;
  }

  $('btnFilter').addEventListener('click', () => { refreshFilterOptions(); $('filterPanel').classList.toggle('open'); });
  $('btnFilterApply').addEventListener('click', () => {
    filter.course = $('filterSelectCourse').value;
    filter.type = $('filterSelectType').value;
    renderCards();
    $('filterPanel').classList.remove('open');

  $('btnFilterClear').addEventListener('click', () => {
    filter.course = '';
    filter.type = '';
    refreshFilterOptions();
    renderCards();
    $('filterPanel').classList.remove('open');
  });

  function isModalOpen() { return $('courseModal').style.display === 'flex' || $('shareModal').style.display === 'flex' || $('configModal').style.display === 'flex'; }

  function fillCoursesDatalist() {
    const list = $('coursesDatalist'); list.innerHTML = '';
    catalog.forEach((c) => { const o = document.createElement('option'); o.value = c.name; list.appendChild(o); });
  }
  function updateCoursesDatalist() { fillCoursesDatalist(); }
  function updateLocationsDatalist() {
    const list = $('locationsList'); list.innerHTML = '';
    locations.forEach((loc) => { const o = document.createElement('option'); o.value = loc; list.appendChild(o); });
  }

  $('courseSearch').addEventListener('input', (e) => {
    const val = e.target.value;
    const exact = catalog.find((c) => c.name === val);
    if (exact) { $('courseType').value = exact.type; $('courseSubTitle').value = exact.subtitle; return; }
    const code = val.split(' - ')[0].trim();
    if (code && !$('courseSubTitle').value) {
      const byCode = catalog.find((c) => c.name.split(' - ')[0].trim() === code);
      if (byCode) $('courseSubTitle').value = byCode.subtitle;
    }
  });

  function openModal(week, day, hour) {
    if (viewOnly) return;
    const item = findItemAt(week, day, hour);
    modalCtx = { editing: item, week, day, hour };
    $('modalError').textContent = '';
    if (item) {
      $('courseSearch').value = item.title; $('courseSubTitle').value = item.subtitle;
      $('courseType').value = item.type; $('courseLocation').value = item.loc; $('courseDuration').value = String(item.duration);
      $('btnModalCopy').style.display = 'inline-block'; $('btnModalPaste').style.display = 'none'; $('btnDeleteCourse').style.display = 'inline-block';
    } else {
      $('courseSearch').value = ''; $('courseSubTitle').value = ''; $('courseType').value = 'theorie';
      $('courseLocation').value = ''; $('courseDuration').value = String(Math.min(2, H - hour));
      $('btnModalCopy').style.display = 'none'; $('btnModalPaste').style.display = copiedBuffer ? 'inline-block' : 'none';
      $('btnDeleteCourse').style.display = 'none';
    }
    updateLocationsDatalist(); fillCoursesDatalist();
    $('courseModal').style.display = 'flex'; $('courseSearch').focus();
  }
  function closeModal() { $('courseModal').style.display = 'none'; }

  function saveCourse() {
    const title = $('courseSearch').value.trim();
    if (!title) { $('modalError').textContent = "Indiquez un nom de cours (ou utilisez « Supprimer »)."; return; }
    const week = modalCtx.week, day = modalCtx.day, hour = modalCtx.hour, editing = modalCtx.editing;
    const type = $('courseType').value, subtitle = $('courseSubTitle').value.trim();
    const loc = $('courseLocation').value.trim(), duration = parseInt($('courseDuration').value, 10);

    const err = placementError(week, day, hour, duration, editing ? editing.id : null);
    if (err) { $('modalError').textContent = err; return; }

    if (editing) {
      removeItem(week, editing.id);
      editing.title = title; editing.subtitle = subtitle; editing.type = type; editing.loc = loc; editing.duration = duration;
      courses[week].push(editing);
    } else {
      courses[week].push({ id: uid(), day, hour, duration, title, subtitle, type, loc });
    }
    saveLocation(loc);
    saveLocalAll(); scheduleCloudSave(); pushHistory(); renderCards(); refreshFilterOptions(); closeModal();
  }
  function deleteCourse() {
    const week = modalCtx.week, editing = modalCtx.editing;
    if (editing) { removeItem(week, editing.id); saveLocalAll(); scheduleCloudSave(); pushHistory(); renderCards(); refreshFilterOptions(); }
    closeModal();
  }
  let copiedBuffer = null;
  function copyCurrentCourseModal() {
    const it = modalCtx.editing;
    if (it) { copiedBuffer = { title: it.title, subtitle: it.subtitle, type: it.type, loc: it.loc, duration: it.duration }; toast('Cours copié.'); }
    closeModal();
  }
  function pasteCourseModal() {
    if (!copiedBuffer) return;
    const week = modalCtx.week, day = modalCtx.day, hour = modalCtx.hour;
    const err = placementError(week, day, hour, copiedBuffer.duration, null);
    if (err) { $('modalError').textContent = err; return; }
    courses[week].push({ id: uid(), day, hour, duration: copiedBuffer.duration, title: copiedBuffer.title, subtitle: copiedBuffer.subtitle, type: copiedBuffer.type, loc: copiedBuffer.loc });
    saveLocalAll(); scheduleCloudSave(); pushHistory(); renderCards(); refreshFilterOptions(); closeModal();
  }
  function saveLocation(loc) {
    if (!loc) return;
    if (!locations.includes(loc)) { locations.push(loc); saveLocalAll(); scheduleCloudSave(); }
  }

  $('btnSaveCourse').addEventListener('click', saveCourse);
  $('btnDeleteCourse').addEventListener('click', deleteCourse);
  $('btnModalCopy').addEventListener('click', copyCurrentCourseModal);
  $('btnModalPaste').addEventListener('click', pasteCourseModal);
  $('btnCancelCourse').addEventListener('click', closeModal);
  $('courseModal').addEventListener('click', (e) => { if (e.target === $('courseModal')) closeModal(); });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (isModalOpen()) { closeModal(); $('shareModal').style.display = 'none'; $('configModal').style.display = 'none'; } $('filterPanel').classList.remove('open'); return; }

    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
      if (isModalOpen()) return;
      const t = e.target; if (t && t.closest && t.closest('input,textarea,select')) return;
      e.preventDefault(); undo(); return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
      if (isModalOpen()) return;
      const t = e.target; if (t && t.closest && t.closest('input,textarea,select')) return;
      e.preventDefault(); redo(); return;
    }

    if (!(e.ctrlKey || e.metaKey)) return;
    if (isModalOpen() || drawMode !== 'none' || viewOnly) return;
    const t = e.target; if (t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]')) return;
    if (!hovered) return;

    const key = e.key.toLowerCase();
    if (key === 'c') {
      if (String(window.getSelection && window.getSelection()).length > 0) return;
      const it = findItemAt(hovered.week, hovered.day, hovered.hour);
      if (it) { copiedBuffer = { title: it.title, subtitle: it.subtitle, type: it.type, loc: it.loc, duration: it.duration }; toast('Cours copié.'); }
    } else if (key === 'v' && copiedBuffer) {
      e.preventDefault();
      const err = placementError(hovered.week, hovered.hour, copiedBuffer.duration, null);
      if (err) { toast(err); return; }
      courses[hovered.week].push({ id: uid(), day: hovered.day, hour: hovered.hour, duration: copiedBuffer.duration, title: copiedBuffer.title, subtitle: copiedBuffer.subtitle, type: copiedBuffer.type, loc: copiedBuffer.loc });
      saveLocalAll(); scheduleCloudSave(); pushHistory(); renderCards(); refreshFilterOptions();
    }
  });

  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);

  const canvas = $('drawingCanvas'), ctx = canvas.getContext('2d');
  let cssW = 0, cssH = 0, drawMode = 'none', current = null, currentTop = 0, erasedSomething = false;
  const round4 = (n) => Math.round(n*10000)/10000, round1 = (n) => Math.round(n*10)/10;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    cssW = container.clientWidth; cssH = weeksWrapper.offsetHeight;
    canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }
  function contentPts(s) {
    const n = weekNum(s.w); const top = blocks[n].offsetTop;
    return s.pts.map((p) => [p[0]*cssW, p[1] + top]);
  }
  function drawStroke(s) {
    const pts = contentPts(s);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = s.color || '#dc3545';
    ctx.globalAlpha = s.kind === 'highlight' ? 0.4 : 1;
    ctx.lineWidth = s.kind === 'highlight' ? 14 : 2.5;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  function redraw() { ctx.clearRect(0,0,cssW,cssH); strokes.forEach(drawStroke); if (current && !current.eraser) drawStroke(current); }

  function setMode(mode) {
    if (viewOnly) return;
    const buttons = { pen: $('toolPen'), highlight: $('toolHighlighter'), eraser: $('toolEraser') };
    drawMode = drawMode === mode ? 'none' : mode;
    Object.keys(buttons).forEach((m) => buttons[m].classList.toggle('selected', drawMode === m));
    const active = drawMode !== 'none';
    $('btnPencil').classList.toggle('btn-active', active);
    $('drawingToolbar').classList.toggle('active', active);
    canvas.classList.toggle('active', active);
  }
  $('btnPencil').addEventListener('click', () => setMode(drawMode === 'none' ? 'pen' : 'none'));
  $('toolPen').addEventListener('click', () => setMode('pen'));
  $('toolHighlighter').addEventListener('click', () => setMode('highlight'));
  $('toolEraser').addEventListener('click', () => setMode('eraser'));
  $('btnClearCanvas').addEventListener('click', () => {
    const n = weekNum(currentVisibleWeek);
    const before = strokes.length;
    strokes = strokes.filter((s) => weekNum(s.w) !== n);
    if (strokes.length !== before) { saveLocalAll(); scheduleCloudSave(); pushHistory(); redraw(); }
  });

  function pointerPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function weekAtY(y) {
    for (let w = 1; w <= CONFIG.weeks; w++) {
      const b = blocks[w];
      if (b && y >= b.offsetTop && y < b.offsetTop + b.offsetHeight) return { key: weekKey(w), top: b.offsetTop };
    }
    return null;
  }
  function distToSeg(px,py,ax,ay,bx,by) {
    const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
    let t = len2===0?0:((px-ax)*dx+(py-ay)*dy)/len2; t = Math.max(0,Math.min(1,t));
    return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
  }
  function hitStroke(s,x,y) { const pts = contentPts(s); for (let i=0;i<pts.length-1;i++) if (distToSeg(x,y,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1])<=14) return true; return false; }
  function eraseAt(p) { const before = strokes.length; strokes = strokes.filter((s) => !hitStroke(s,p.x,p.y)); if (strokes.length!==before) { erasedSomething = true; redraw(); } }

  canvas.addEventListener('pointerdown', (e) => {
    if (drawMode === 'none' || viewOnly) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
    const p = pointerPos(e);
    if (drawMode === 'eraser') { erasedSomething = false; current = { eraser:true }; eraseAt(p); return; }
    const wk = weekAtY(p.y); if (!wk) return;
    currentTop = wk.top;
    const pt = [round4(p.x/cssW), round1(p.y - wk.top)];
    current = { w: wk.key, kind: drawMode, color: $('toolColor').value, pts: [pt] };
    redraw();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!current) return;
    const p = pointerPos(e);
    if (current.eraser) { eraseAt(p); return; }
    const pt = [round4(p.x/cssW), round1(p.y - currentTop)];
    const last = current.pts[current.pts.length-1];
    if (Math.hypot((pt[0]-last[0])*cssW, pt[1]-last[1]) < 1.5) return;
    current.pts.push(pt); redraw();
  });
  function stopDrawing() {
    if (!current) return;
    const s = current; current = null;
    if (s.eraser) { if (erasedSomething) { saveLocalAll(); scheduleCloudSave(); pushHistory(); } return; }
    if (s.pts.length < 2) { redraw(); return; }
    strokes.push(s); saveLocalAll(); scheduleCloudSave(); pushHistory(); redraw();
  }
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);

  let nowLineEl = null;
  function positionNowLine() {
    if (nowLineEl) { nowLineEl.remove(); nowLineEl = null; }
    const wk = getCurrentWeekKey(); const n = weekNum(wk);
    const now = new Date();
    const startMinutes = 8*60, endMinutes = 20*60, curMinutes = now.getHours()*60+now.getMinutes();
    if (curMinutes < startMinutes || curMinutes >= endMinutes) return;
    const hourFloor = Math.floor((curMinutes - startMinutes)/60);
    const frac = ((curMinutes - startMinutes) % 60) / 60;
    const day = (now.getDay() + 6) % 7;
    const slot = slotMap[wk + '-' + day + '-' + hourFloor];
    if (!slot) return;
    const line = document.createElement('div');
    line.className = 'now-line';
    line.style.top = (slot.offsetTop + frac*slot.offsetHeight) + 'px';
    line.style.left = slot.offsetLeft + 'px';
    line.style.width = slot.offsetWidth + 'px';
    container.appendChild(line);
    nowLineEl = line;
  }
  setInterval(positionNowLine, 60000);

  function copyPreviousWeek() {
    const n = weekNum(currentVisibleWeek); if (n <= 1) { toast('Pas de semaine précédente avant la S1 !'); return; }
    const prev = weekKey(n-1);
    if (confirm('Copier la ' + prev + ' dans la ' + currentVisibleWeek + ' ? (le contenu actuel sera remplacé)')) {
      courses[currentVisibleWeek] = courses[prev].map((c) => Object.assign({}, c, { id: uid() }));
      saveLocalAll(); scheduleCloudSave(); pushHistory(); renderCards(); refreshFilterOptions();
    }
  }
  function clearCurrentWeek() {
    if (confirm("Effacer l'emploi du temps de la semaine " + currentVisibleWeek + ' ?')) {
      courses[currentVisibleWeek] = [];
      saveLocalAll(); scheduleCloudSave(); pushHistory(); renderCards(); refreshFilterOptions();
    }
  }
  $('btnCopyPrev').addEventListener('click', copyPreviousWeek);
  $('btnClearWeek').addEventListener('click', clearCurrentWeek);

  function goToWeek(wk) {
    currentVisibleWeek = wk;
    updateNavBarDisplay(wk);
    const targetW = weekNum(wk);
    const t = blocks[targetW]; 
    if (t) t.scrollIntoView({ behavior:'smooth' });
  }

  $('btnPrevWeek').addEventListener('click', () => {
    let n = weekNum(currentVisibleWeek) - 1;
    if (n < 1) n = 1;
    goToWeek(weekKey(n));
  });

  $('btnNextWeek').addEventListener('click', () => {
    let n = weekNum(currentVisibleWeek) + 1;
    if (n > CONFIG.weeks) n = CONFIG.weeks;
    goToWeek(weekKey(n));
  });

  $('btnTodayNav').addEventListener('click', () => {
    const todayWk = getCurrentWeekKey();
    goToWeek(todayWk);
  });

  function dateToWeekNum(dateVal) {
    const selectedDate = new Date(dateVal);
    const start = new Date(CONFIG.startDateS1.getFullYear(), CONFIG.startDateS1.getMonth(), CONFIG.startDateS1.getDate());
    const diffTime = selectedDate - start;
    const diffDays = Math.floor(diffTime / 86400000);
    if (diffDays < 0) return 1;
    let n = Math.floor(diffDays / 7) + 1;
    return Math.min(Math.max(n, 1), CONFIG.weeks);
  }

  function applyDateRangeFilter() {
    const startInput = $('startDatePicker').value;
    const endInput = $('endDatePicker').value;
    
    let startW = 1;
    let endW = CONFIG.weeks;

    if (startInput) startW = dateToWeekNum(startInput);
    if (endInput) endW = dateToWeekNum(endInput);

    if (startW > endW) {
      toast("La date de début doit être antérieure à la date de fin.");
      return;
    }

    for (let w = 1; w <= CONFIG.weeks; w++) {
      if (w >= startW && w <= endW) {
        blocks[w].style.display = '';
      } else {
        blocks[w].style.display = 'none';
      }
    }
    updateRangeDisplay(weekKey(startW), weekKey(endW));
    resizeCanvas();
    toast("Affichage filtré de la semaine " + startW + " à la semaine " + endW);
  }

  $('btnStartDate').addEventListener('click', () => {
    $('startDatePicker').showPicker?.() || $('startDatePicker').click();
  });
  $('startDatePicker').addEventListener('change', applyDateRangeFilter);

  $('btnEndDate').addEventListener('click', () => {
    $('endDatePicker').showPicker?.() || $('endDatePicker').click();
  });
  $('endDatePicker').addEventListener('change', applyDateRangeFilter);

  function onScroll() {
    const probe = container.getBoundingClientRect().top + 150;
    for (let w = 1; w <= CONFIG.weeks; w++) {
      if (blocks[w].style.display === 'none') continue;
      const r = blocks[w].getBoundingClientRect();
      if (r.top <= probe && r.bottom >= probe) { 
        currentVisibleWeek = weekKey(w); 
        updateNavBarDisplay(currentVisibleWeek);
        break; 
      }
    }
  } 
  container.addEventListener('scroll', onScroll, { passive:true });

  let currentConfigType = null;
  function openConfigModal(type) {
    if (viewOnly) return;
    currentConfigType = type;
    $('configError').textContent = '';
    if (type === 'courses') {
      $('configModalTitle').textContent = "Catalogue de cours";
      $('configModalDesc').textContent = "Un cours par ligne, au format : Nom | type | Intitulé complet. Type = theorie, exercices, labo ou etude.";
      $('configTextarea').value = catalog.map((c) => c.name + ' | ' + c.type + ' | ' + c.subtitle).join('\n');
    } else {
      $('configModalTitle').textContent = "Liste des locaux";
      $('configModalDesc').textContent = "Un local par ligne.";
      $('configTextarea').value = locations.join('\n');
    }
    $('configModal').style.display = 'flex';
  } 
  function closeConfigModal() { $('configModal').style.display = 'none'; }
  function saveConfigModal() {
    const lines = $('configTextarea').value.split('\n').map((l) => l.trim()).filter((l) => l);
    if (currentConfigType === 'courses') {
      const parsed = lines.map((line) => {
        const parts = line.split('|').map((p) => p.trim());
        return { name: parts[0] || '', type: parts[1] || 'theorie', subtitle: parts[2] || '' };  
      }).filter((c) => c.name);
      catalog = normalizeCatalog(parsed);
      updateCoursesDatalist(); toast("Catalogue de cours mis à jour.");
    } else {
      locations = normalizeLocations(lines);
      updateLocationsDatalist(); toast("Liste des locaux mise à jour.");
    }
    saveLocalAll(); scheduleCloudSave(); pushHistory(); closeConfigModal();
  }
  $('btnConfigCourses').addEventListener('click', () => openConfigModal('courses'));
  $('btnConfigLocations').addEventListener('click', () => openConfigModal('locations'));
  $('btnSaveConfig').addEventListener('click', saveConfigModal);
  $('btnCloseConfig').addEventListener('click', closeConfigModal);
  $('configModal').addEventListener('click', (e) => { if (e.target === $('configModal')) closeConfigModal(); }); 

  let cloudUser = null;
  let saveTimer = null;
  const SAVE_DELAY = 1500;

  function setSaveStatus(kind, text) {
    $('saveDot').className = 'save-dot' + (kind ? ' ' + kind : '');
    $('saveText').textContent = text;
  }

  function doCloudSaveNow() {
    if (!cloudUser || viewOnly) return;
    clearTimeout(saveTimer); saveTimer = null;
    setSaveStatus('saving', 'Enregistrement...');
    const fs = window.__fs;
    fs.setDoc(fs.doc(fs.db, 'users', cloudUser.uid), Object.assign({ updatedAt: new Date().toISOString() }, serializeAll()))
      .then(() => {
        setSaveStatus('saved', 'Enregistré');
      })
      .catch(() => setSaveStatus('error', 'Échec de sauvegarde'));
  }
  function scheduleCloudSave() {
    if (!cloudUser || viewOnly) return;
    setSaveStatus('saving', 'Modifications en attente...');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doCloudSaveNow, SAVE_DELAY);
  }
  function flushCloudSave() { if (saveTimer) doCloudSaveNow(); }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushCloudSave(); });
  window.addEventListener('pagehide', flushCloudSave);

  function loadFromCloud() {
    if (!cloudUser) return;
    const fs = window.__fs;
    fs.getDoc(fs.doc(fs.db, 'users', cloudUser.uid)).then((snap) => {
      if (snap.exists()) {
        const data = snap.data();
        courses = normalizeCourses(data.courses);
        strokes = normalizeStrokes(data.strokes);
        catalog = normalizeCatalog(data.catalog);
        locations = normalizeLocations(data.locations);
      }
      saveLocalAll();
      renderCards(); updateLocationsDatalist(); updateCoursesDatalist(); refreshFilterOptions(); redraw(); positionNowLine();
      history = [snapshot()]; historyIndex = 0; updateHistoryButtons();
      setSaveStatus('saved', 'Synchronisé');
    }).catch(() => setSaveStatus('error', 'Connexion au cloud impossible'));
  }

  window.addEventListener('app:signed-in', (e) => {
    cloudUser = e.detail; window.__offlineChoice = false;
    viewOnly = false; applyViewOnlyUI();
    loadFromCloud();
  });
  window.addEventListener('app:signed-out', () => {
    cloudUser = null; setSaveStatus('offline', 'Non connecté');
  });
  window.addEventListener('app:before-logout', () => { flushCloudSave(); });
  window.addEventListener('app:offline-mode', () => {
    window.__offlineChoice = true; cloudUser = null; setSaveStatus('offline', 'Hors ligne (non sauvegardé en ligne)');
  });

  $('btnShare').addEventListener('click', () => {
    $('shareModal').style.display = 'flex';
  });

  $('btnShareClose').addEventListener('click', () => {
    $('shareModal').style.display = 'none';
  });

  $('btnShareLink').addEventListener('click', async () => {
    $('shareModal').style.display = 'none';
    if (!cloudUser) { 
      toast('Connectez-vous pour générer un lien de partage cloud.'); 
      return; 
    }
    const fs = window.__fs;
    try {
      await fs.setDoc(fs.doc(fs.db, 'shared', cloudUser.uid), Object.assign({ updatedAt: new Date().toISOString() }, serializeAll()));
      const url = location.origin + location.pathname + '?share=' + encodeURIComponent(cloudUser.uid);
      if (navigator.clipboard) await navigator.clipboard.writeText(url);
      toast('Lien de partage copié dans le presse-papier !');
    } catch (e) {
      toast('Erreur lors de la création du lien de partage.');
    }
  });

  $('btnSharePDF').addEventListener('click', () => {
    $('shareModal').style.display = 'none';
    toast('Génération du PDF en cours...');
    
    const toolbar = document.querySelector('.controls-box');
    toolbar.style.display = 'none';

    const element = document.getElementById('weeksWrapper');
    const opt = {
      margin:       5,
      filename:     'emploi-du-temps.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };

    html2pdf().from(element).set(opt).save().then(() => {
      toolbar.style.display = 'flex';
      toast('PDF téléchargé avec succès !');
    }).catch(() => {
      toolbar.style.display = 'flex';
      toast('Erreur lors de la génération du PDF.');
    });
  });

  $('btnShareJSON').addEventListener('click', () => {
    $('shareModal').style.display = 'none';
    const data = Object.assign({ app:'emploi-du-temps', version:3, exported:new Date().toISOString() }, serializeAll());
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'emploi-du-temps-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Fichier JSON téléchargé.');
  });

  function applyViewOnlyUI() {
    document.getElementById('editGroup1').style.display = viewOnly ? 'none' : 'flex';
    document.getElementById('editGroup2').style.display = viewOnly ? 'none' : 'flex';
    $('viewOnlyBadge').style.display = viewOnly ? 'inline-block' : 'none';
    document.querySelectorAll('.slot').forEach((s) => s.classList.toggle('view-only', viewOnly));
  }

  function tryEnterShareView() {
    const params = new URLSearchParams(location.search);
    const shareUid = params.get('share');
    if (!shareUid) return false;
    viewOnly = true;
    document.getElementById('authOverlay').style.display = 'none';
    applyViewOnlyUI();
    const fs = window.__fs;
    fs.getDoc(fs.doc(fs.db, 'shared', shareUid)).then((snap) => {
      if (!snap.exists()) { toast("Cet emploi du temps n'est plus partagé."); return; }
      const data = snap.data();
      courses = normalizeCourses(data.courses);
      strokes = normalizeStrokes(data.strokes);
      catalog = normalizeCatalog(data.catalog);
      locations = normalizeLocations(data.locations);
      renderCards(); redraw(); refreshFilterOptions(); positionNowLine();
    }).catch(() => toast("Impossible de charger cet emploi du temps partagé."));
    return true;
  }

  buildWeeks();

  courses = normalizeCourses(readJSON(LS.courses, {}));
  strokes = normalizeStrokes(readJSON(LS.strokes, []));
  catalog = normalizeCatalog(readJSON(LS.catalog, null));
  locations = normalizeLocations(readJSON(LS.locations, null));
  renderCards(); updateLocationsDatalist(); updateCoursesDatalist(); refreshFilterOptions();
  history = [snapshot()]; historyIndex = 0;

  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => { resizeCanvas(); positionNowLine(); });
    ro.observe(container); ro.observe(weeksWrapper);
  } else { window.addEventListener('resize', () => { resizeCanvas(); positionNowLine(); }); }

  window.addEventListener('load', () => {
    const shared = tryEnterShareView();
    if (!shared) {
      const targetWeek = getCurrentWeekKey();
      currentVisibleWeek = targetWeek; 
      updateNavBarDisplay(targetWeek);
      resizeCanvas(); 
      setTimeout(() => {
        const targetW = weekNum(targetWeek);
        const t = blocks[targetW]; 
        if (t) t.scrollIntoView({ behavior:'smooth' });
      }, 150);
      setSaveStatus('offline', 'Non connecté');
    }
    positionNowLine();
  });
})();
</script>
</body>
</html>
