<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon Emploi du Temps XL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <h2 id="authTitle">Connexion</h2>
    <input type="email" id="email" placeholder="Adresse e-mail" autocomplete="email">
    <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="btnAuth" type="button">Se connecter</button>
    <button id="btnForgot" type="button" class="link-btn">Mot de passe oublié ?</button>
    <p id="authMsg" class="auth-msg"></p>
    <div class="link-btn" id="switchText" style="text-align:center;">Pas encore de compte ? S'inscrire</div>
    <div class="auth-skip"><button id="btnSkip" type="button" class="link-btn">Continuer hors ligne</button></div>
  </div>
</div>

<div class="controls-box">
  <!-- Groupe GAUCHE : Aujourd'hui, < >, Date de début - Date de fin -->
  <div class="controls-group">
    <div class="nav-bar-custom">
      <button id="btnTodayNav" class="btn-today" data-tooltip="Aller à aujourd'hui">Aujourd'hui</button>
      <div class="week-switcher">
        <button id="btnPrevWeek" class="btn-week-nav" data-tooltip="Aller à la semaine précédente">&lt;</button>
        <span id="currentWeekText" class="current-week-label">s1</span>
        <button id="btnNextWeek" class="btn-week-nav" data-tooltip="Aller à la semaine suivante">&gt;</button>
      </div>
      <div class="date-range-container">
        <button id="btnStartDate" class="week-dates-btn" data-tooltip="Choisir la date de début"><span id="startDateText">14/09/2026</span></button>
        <input type="date" id="startDatePicker" class="date-picker-hidden">
        <span>-</span>
        <button id="btnEndDate" class="week-dates-btn" data-tooltip="Choisir la date de fin"><span id="endDateText">20/12/2026</span></button>
        <input type="date" id="endDatePicker" class="date-picker-hidden">
      </div>
    </div>
    <span id="viewOnlyBadge" class="viewonly-badge" style="display:none;">👁️ Lecture seule</span>
    <button id="btnGoLogin" class="btn-action btn-share" style="display:none;" data-tooltip="Se connecter">🔑</button>
  </div>
  <div class="controls-group">
    <button id="btnUndo" class="btn-action btn-history" data-tooltip="Revenir en arrière">←</button>
    <button id="btnRedo" class="btn-action btn-history" data-tooltip="Avancer">→</button>
    <button id="btnPencil" class="btn-action btn-draw" data-tooltip="Dessiner à main levée">✏️</button>
    <button id="btnCopyPrev" class="btn-action btn-copy" data-tooltip="Copier la semaine précédente">📋</button>
    <button id="btnClearWeek" class="btn-action btn-clear" data-tooltip="Effacer toute la semaine">🗑️</button>
  </div>

  <!-- Groupe DROITE : Catalogue, Filtre, Partager, Statut, Compte -->
  <div class="controls-group">

    <!-- Catalogue -->
    <div style="position: relative; display: inline-block;">
      <button id="btnCatalogToggle" class="btn-action btn-config" data-tooltip="Gérer cours, modalités et locaux">📚<span class="btn-label"> Catalogue</span></button>
      <div id="catalogDropdownPanel" class="catalog-dropdown-panel">
        <div class="catalog-tabs">
          <button class="catalog-tab-btn active" data-tab="courses">📖 Cours</button>
          <button class="catalog-tab-btn" data-tab="types">🏷️ Modalités</button>
          <button class="catalog-tab-btn" data-tab="locaux">📍 Locaux</button>
        </div>

        <div id="tabContentCourses" class="catalog-tab-content">
          <p class="modal-hint" style="margin-bottom:6px;">Format : Nom | Intitulé (facultatif)</p>
          <textarea id="panelCoursesTextarea" rows="7" placeholder="Ajouter des cours ..."></textarea>
          <button id="btnSavePanelCourses" class="btn-action btn-save" style="width:100%; margin-top:6px; justify-content:center;">Enregistrer les cours</button>
        </div>

        <div id="tabContentTypes" class="catalog-tab-content" style="display:none;">
          <p class="modal-hint" style="margin-bottom:6px;">Une modalité par ligne (ex: Exercices 1, TP...)</p>
          <textarea id="panelTypesTextarea" rows="7" placeholder="Ajouter des modalités ..."></textarea>
          <button id="btnSavePanelTypes" class="btn-action btn-save" style="width:100%; margin-top:6px; justify-content:center;">Enregistrer les modalités</button>
        </div>

        <div id="tabContentLocaux" class="catalog-tab-content" style="display:none;">
          <p class="modal-hint" style="margin-bottom:6px;">Un local par ligne.</p>
          <textarea id="panelLocauxTextarea" rows="7" placeholder="Ajouter des locaux ..."></textarea>
          <button id="btnSavePanelLocaux" class="btn-action btn-save" style="width:100%; margin-top:6px; justify-content:center;">Enregistrer les locaux</button>
        </div>
      </div>
    </div>

    <!-- Filtre -->
    <div style="position: relative; display: inline-block;">
      <button id="btnFilter" class="btn-action btn-filter" data-tooltip="Filtrer l'affichage">🔍<span class="btn-label"> Filtre</span></button>
      <div id="filterPanel" class="filter-panel">
        <div class="filter-header">
          <span>Filtre</span>
          <button id="btnFilterClear" class="filter-clear">Effacer filtre</button>
        </div>
        <div class="filter-group">
          <label>Cours</label>
          <select id="filterSelectCourse">
            <option value="">Tous les cours</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Modalité</label>
          <select id="filterSelectType">
            <option value="">Toutes les modalités</option>
          </select>
        </div>
        <button id="btnFilterApply" class="btn-filter-submit">Filtre</button>
      </div>
    </div>

    <!-- Partager -->
    <div style="position: relative; display: inline-block;">
      <button id="btnShare" class="btn-action btn-share" data-tooltip="Partager ou exporter">🔗<span class="btn-label"> Partager</span></button>
      <div id="shareModal" class="catalog-dropdown-panel" style="width:220px; left:auto; right:0;">
        <p class="modal-hint" style="margin-bottom:8px;">Choisissez une action :</p>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button id="btnShareLink" class="btn-action btn-copy" style="justify-content:center; height:32px;">🔗 Copier le lien</button>
          <button id="btnSharePDF" class="btn-action btn-export" style="justify-content:center; height:32px; background:#20c997; color:#111;">📄 Télécharger en PDF</button>
          <button id="btnShareJSON" class="btn-action btn-import" style="justify-content:center; height:32px; background:#17a2b8;">💾 Télécharger en JSON</button>
        </div>
      </div>
    </div>

    <span id="saveStatus" class="save-status"><span class="save-dot" id="saveDot"></span><span id="saveText">Hors ligne</span></span>

    <!-- Mon compte -->
    <div style="position: relative; display: inline-block;">
      <button id="btnAccount" class="btn-action btn-logout" data-tooltip="Mon compte">👤</button>
      <div id="accountPanel" class="filter-panel" style="width:220px; right:0; left:auto;">
        <div class="filter-header">
          <span>Mon compte</span>
        </div>
        <div class="filter-group">
          <label>Connecté en tant que</label>
          <div id="accountEmailDisplay" style="font-size:12px; color:#333; word-break:break-all;"></div>
        </div>
        <button id="btnLogout" class="btn-action btn-clear" style="width:100%; justify-content:center; margin-top:8px;">🚪 Déconnexion</button>
      </div>
    </div>

  </div>
</div>

<div id="drawingToolbar" class="drawing-toolbar">
  <button id="toolPen" class="tool-btn selected" title="Crayon">✏️</button>
  <button id="toolHighlighter" class="tool-btn" title="Surligneur">🖍️</button>
  <button id="toolEraser" class="tool-btn" title="Gomme">🧹</button>
  <input type="color" id="toolColor" class="tool-color-picker" value="#dc3545" title="Couleur du tracé">
  <button id="btnClearCanvas" class="tool-btn" title="Effacer cette semaine">🗑️</button>
</div>

<div class="timetable-container" id="scrollContainer">
  <canvas id="drawingCanvas"></canvas>
  <div id="weeksWrapper"></div>
</div>

<div class="modal" id="courseModal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <h3 style="margin:0 0 4px;">Détails de l'activité</h3>
    <div>
      <label for="courseSearch">Nom du cours :</label>
      <input type="text" id="courseSearch" list="coursesDatalist" placeholder="Ex: ELECH3001" autocomplete="off">
      <datalist id="coursesDatalist"></datalist>
    </div>
    <div>
      <label for="courseDuration">Durée :</label>
      <select id="courseDuration">
        <option value="1">1 heure</option><option value="2" selected>2 heures</option>
        <option value="3">3 heures</option><option value="4">4 heures</option>
      </select>
    </div>
    <div>
      <label for="courseType">Type :</label>
      <input type="text" id="courseType" list="typesList" placeholder="Ex: Théorie, Exercices 1..." autocomplete="off">
      <datalist id="typesList"></datalist>
    </div>
    <div>
      <label for="courseLocation">Local / Lieu :</label>
      <input type="text" id="courseLocation" list="locationsList" placeholder="Ex: Auditoire FERRER..." autocomplete="off">
      <datalist id="locationsList"></datalist>
    </div>
    <div id="modalError" class="modal-error" role="alert"></div>
    <div class="btn-group">
      <button id="btnSaveCourse" class="btn-action btn-save">Enregistrer</button>
      <button id="btnModalCopy" class="btn-action btn-modal-copy">📋 Copier</button>
      <button id="btnModalPaste" class="btn-action btn-modal-paste" style="display:none;">📋 Coller</button>
      <button id="btnDeleteCourse" class="btn-action btn-delete">Supprimer</button>
      <button id="btnCancelCourse" class="btn-action btn-cancel">Annuler</button>
    </div>
  </div>
</div>

<div class="modal" id="configModal" role="dialog" aria-modal="true">
  <div class="modal-content" style="width:380px;">
    <h3 id="configModalTitle" style="margin:0 0 4px;">Gestion</h3>
    <p id="configModalDesc" class="modal-hint"></p>
    <textarea id="configTextarea" rows="10" placeholder="Un élément par ligne..."></textarea>
    <div id="configError" class="modal-error" role="alert"></div>
    <div class="btn-group">
      <button id="btnSaveConfig" class="btn-action btn-save">Mettre à jour</button>
      <button id="btnCloseConfig" class="btn-action btn-cancel">Fermer</button>
    </div>
  </div>
</div>

<div class="modal" id="pdfModal" role="dialog" aria-modal="true">
  <div class="modal-content" style="width:380px;">
    <h3 style="margin:0 0 4px;">Document PDF (Imprimer)</h3>
    <div>
      <label for="pdfTitleInput">Titre principal</label>
      <input type="text" id="pdfTitleInput" placeholder="Mon Emploi du Temps XL">
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label for="pdfPaperSize">Taille de papier</label>
        <select id="pdfPaperSize">
          <option value="a4" selected>A4</option>
          <option value="letter">Letter</option>
        </select>
      </div>
      <div>
        <label for="pdfOrientation">Orientation</label>
        <select id="pdfOrientation">
          <option value="landscape" selected>Paysage</option>
          <option value="portrait">Portrait</option>
        </select>
      </div>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label for="pdfFontSize">Taille de police</label>
        <select id="pdfFontSize">
          <option value="8">8</option>
          <option value="9" selected>9</option>
          <option value="10">10</option>
          <option value="12">12</option>
        </select>
      </div>
      <div>
        <label for="pdfColorMode">Couleur</label>
        <select id="pdfColorMode">
          <option value="color" selected>Couleur</option>
          <option value="grayscale">Noir et blanc</option>
        </select>
      </div>
    </div>
    <div style="margin-top: 6px; display:flex; flex-direction:column; gap:6px;">
      <button id="btnGeneratePDF" class="btn-action btn-save" style="width:100%; justify-content:center; background:#0f5132; color:#fff; height:32px;">Créer PDF</button>
      <button id="btnCancelPDF" class="btn-action btn-cancel" style="width:100%; justify-content:center; height:32px;">Annuler</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
